<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<title>കുടുംബ ദൈനംദിന ജ്യോതിഷ വഴികാട്ടി | Family Daily Jyotish Compass</title>
<style>
  :root {
    --bg-top: #eef4f8;
    --bg-bottom: #f7f5f0;
    --surface: rgba(255, 255, 255, 0.90);
    --surface-solid: #ffffff;
    --surface-soft: #f2f6f9;
    --ink: #1a2938;
    --muted: #5a6d7e;
    --accent: #275d8c;
    --accent-deep: #1b4266;
    --accent-soft: #e3eff9;
    --border: rgba(39, 93, 140, 0.12);
    --great-bg: #e4f4ec;
    --great-fg: #185a3a;
    --good-bg: #e5effa;
    --good-fg: #1d4b82;
    --okay-bg: #fbf3e4;
    --okay-fg: #7c4d14;
    --slow-bg: #fbeaea;
    --slow-fg: #872929;
    --radius-lg: 24px;
    --radius-md: 18px;
    --radius-sm: 12px;
    --shadow-soft: 0 12px 32px rgba(26, 41, 56, 0.06);
    --shadow-pill: 0 4px 12px rgba(26, 41, 56, 0.04);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans Malayalam", "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(175deg, var(--bg-top) 0%, var(--bg-bottom) 48%, #f4f1ea 100%);
    color: var(--ink);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 20px 18px 68px;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 6px 4px 18px;
  }

  .brand h1 {
    margin: 0;
    font-size: 1.32rem;
    font-weight: 700;
    color: var(--accent-deep);
    letter-spacing: -0.015em;
  }

  .brand p {
    margin: 3px 0 0;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .pill-toggle {
    display: inline-flex;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 999px;
    padding: 4px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-pill);
  }

  .pill-toggle button {
    border: none;
    background: transparent;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.83rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.2s ease;
  }

  .pill-toggle button.active {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(39, 93, 140, 0.26);
  }

  .date-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 4px 0 16px;
    background: var(--surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 12px 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
  }

  .date-nav {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }

  .btn {
    border: 1px solid var(--border);
    background: var(--surface-solid);
    color: var(--ink);
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 0.83rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s ease;
  }

  .btn:hover {
    background: var(--accent-soft);
    border-color: rgba(39, 93, 140, 0.28);
    color: var(--accent-deep);
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .btn-primary:hover {
    background: var(--accent-deep);
    color: #fff;
  }

  input[type="date"], input[type="text"], input[type="time"], select {
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 0.86rem;
    font-family: inherit;
    background: var(--surface-solid);
    color: var(--ink);
    outline: none;
  }

  .modal input[type="date"],
  .modal input[type="text"],
  .modal input[type="time"],
  .modal select {
    border-radius: var(--radius-sm);
    padding: 10px 12px;
  }

  .kollam-pill {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--accent-deep);
    background: var(--accent-soft);
    padding: 6px 14px;
    border-radius: 999px;
  }

  .sub-nav-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 18px;
  }

  .profiles-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .profile-pill {
    border: 1px solid var(--border);
    background: var(--surface);
    backdrop-filter: blur(10px);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.87rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--ink);
    box-shadow: var(--shadow-pill);
    transition: all 0.2s ease;
  }

  .profile-pill.active {
    background: linear-gradient(135deg, #275d8c 0%, #1d466b 100%);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 6px 16px rgba(39, 93, 140, 0.26);
  }

  /* Empty-State Onboarding */
  .empty-state {
    background: linear-gradient(145deg, #ffffff 0%, #f1f7fb 100%);
    border-radius: var(--radius-lg);
    border: 1px solid rgba(39, 93, 140, 0.14);
    box-shadow: var(--shadow-soft);
    padding: 38px 24px;
    text-align: center;
    max-width: 520px;
    margin: 18px auto 0;
  }

  .empty-icon {
    width: 62px;
    height: 62px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.65rem;
  }

  .empty-state h2 { margin: 0 0 8px; font-size: 1.25rem; color: var(--accent-deep); }
  .empty-state p { margin: 0 auto 22px; font-size: 0.94rem; color: var(--muted); max-width: 410px; }
  .empty-state .btn-primary { padding: 11px 24px; font-size: 0.94rem; }

  /* Calm Sanctuary Hero Verdict Card */
  .verdict-card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(145deg, #ffffff 0%, #f3f8fc 100%);
    border-radius: var(--radius-lg);
    border: 1px solid rgba(39, 93, 140, 0.14);
    box-shadow: var(--shadow-soft);
    padding: 24px 24px 22px;
    margin-bottom: 18px;
  }

  .verdict-top {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
  }

  .person-meta h2 {
    margin: 0;
    font-size: 1.32rem;
    font-weight: 700;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .meta-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 10px;
  }

  .tag {
    font-size: 0.79rem;
    background: rgba(39, 93, 140, 0.07);
    color: #2c4358;
    padding: 4px 11px;
    border-radius: 999px;
    font-weight: 500;
  }

  .status-badge {
    padding: 9px 18px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.94rem;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }

  .st-great { background: var(--great-bg); color: var(--great-fg); }
  .st-good  { background: var(--good-bg);  color: var(--good-fg); }
  .st-okay  { background: var(--okay-bg);  color: var(--okay-fg); }
  .st-slow  { background: var(--slow-bg);  color: var(--slow-fg); }

  .verdict-summary {
    margin: 16px 0 0;
    padding-top: 14px;
    border-top: 1px solid rgba(39, 93, 140, 0.09);
    font-size: 0.98rem;
    color: #243748;
  }

  /* 3-Domain Guidance Cards */
  .grid-3 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }

  .domain-card {
    background: var(--surface-solid);
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
    padding: 18px 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .domain-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .domain-head h3 { margin: 0; font-size: 0.98rem; font-weight: 700; color: var(--accent-deep); }

  .d-pill {
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .domain-card p { margin: 0; font-size: 0.92rem; color: #334657; }

  /* Kerala Pariharam (Temple & Offering Remedy) Card */
  .remedy-card {
    background: linear-gradient(145deg, #fffdf9 0%, #fcf6ea 100%);
    border-radius: var(--radius-lg);
    border: 1px solid rgba(180, 120, 40, 0.22);
    box-shadow: var(--shadow-soft);
    padding: 20px 22px;
    margin-bottom: 18px;
  }

  .remedy-card h3 {
    margin: 0 0 6px;
    font-size: 1.02rem;
    font-weight: 700;
    color: #6b4210;
  }

  .remedy-sub {
    margin: 0 0 14px;
    font-size: 0.84rem;
    color: #7c5827;
  }

  .remedy-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
  }

  .remedy-item {
    background: #ffffff;
    border: 1px solid rgba(180, 120, 40, 0.16);
    border-left: 4px solid #b87324;
    border-radius: var(--radius-sm);
    padding: 13px 15px;
  }

  .remedy-deity {
    font-weight: 700;
    font-size: 0.94rem;
    color: #2b1d0c;
  }

  .remedy-day {
    display: inline-block;
    margin-top: 4px;
    font-size: 0.76rem;
    font-weight: 700;
    color: #8a5214;
    background: #fdf1df;
    padding: 2px 9px;
    border-radius: 999px;
  }

  .remedy-offering {
    margin: 8px 0 4px;
    font-size: 0.88rem;
    color: #243748;
    font-weight: 500;
  }

  .remedy-reason {
    margin: 0;
    font-size: 0.78rem;
    color: var(--muted);
  }

  /* Daytime Windows Card */
  .windows-card {
    background: var(--surface-solid);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
    padding: 20px 22px;
    margin-bottom: 18px;
  }

  .windows-card h3 { margin: 0 0 14px; font-size: 1rem; font-weight: 700; color: var(--accent-deep); }

  .win-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
  }

  .win-box {
    border: 1px solid rgba(39, 93, 140, 0.1);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    background: var(--surface-soft);
  }

  .win-box.good-win {
    background: linear-gradient(135deg, #f3faf6 0%, #eef6fb 100%);
    border-left: 4px solid #2b8a5b;
  }

  .win-box.bad-win {
    background: linear-gradient(135deg, #fdf5f5 0%, #faf3f0 100%);
    border-left: 4px solid #c94a4a;
  }

  .win-title { font-size: 0.76rem; font-weight: 700; color: var(--muted); }
  .win-time  { font-size: 0.96rem; font-weight: 700; color: var(--ink); margin: 4px 0; }
  .win-note  { font-size: 0.8rem; color: var(--muted); line-height: 1.45; }

  /* 7-Day Weekly Forecast Cards */
  .week-card {
    background: var(--surface-solid);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
    padding: 22px;
    margin-bottom: 18px;
  }

  .week-card h3 { margin: 0 0 8px; font-size: 1.08rem; color: var(--accent-deep); }
  .week-overview { margin: 0 0 16px; font-size: 0.94rem; color: #2b3f52; }

  .week-days {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .week-day-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    background: var(--surface-soft);
    border: 1px solid var(--border);
  }

  .week-day-left {
    flex: 1 1 320px;
  }

  .week-day-title {
    font-weight: 700;
    font-size: 0.92rem;
    color: var(--ink);
  }

  .week-day-meta {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .week-day-sum {
    font-size: 0.86rem;
    color: #2c4358;
    margin-top: 5px;
  }

  /* Calm Modal Sheet */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(17, 29, 43, 0.42);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }

  .modal-backdrop.open { display: flex; }

  .modal {
    background: #ffffff;
    border-radius: var(--radius-lg);
    max-width: 440px;
    width: 100%;
    padding: 24px;
    box-shadow: 0 20px 48px rgba(17, 29, 43, 0.2);
  }

  .modal h3 { margin: 0 0 16px; color: var(--accent-deep); font-size: 1.15rem; }
  .form-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; }
  .form-row label { font-size: 0.83rem; font-weight: 600; color: var(--muted); }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  #errBanner {
    display: none;
    background: #fee2e2;
    color: #991b1b;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
    font-size: 0.86rem;
    font-weight: 600;
  }

  @media (max-width: 520px) {
    .wrap { padding: 14px 14px 48px; }
    .verdict-card { padding: 18px 16px; }
    .windows-card, .remedy-card, .week-card { padding: 16px; }
  }
</style>
</head>

<div class="wrap">
  <div id="errBanner"></div>

  <header>
    <div class="brand">
      <h1 id="appTitle">കുടുംബ ദൈനംദിന ജ്യോതിഷ വഴികാട്ടി</h1>
      <p id="appSub">കേരള ജ്യോതിഷ ഗണിതവും ദൈനംദിന മാർഗ്ഗനിർദ്ദേശവും</p>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
      <div class="pill-toggle" role="group" aria-label="View Mode">
        <button id="btnViewDaily" class="active" onclick="setViewMode('daily')">ഇന്ന്</button>
        <button id="btnViewWeekly" onclick="setViewMode('weekly')">ഈ ആഴ്ച (7 ദിവസം)</button>
      </div>
      <div class="lang-toggle pill-toggle" role="group" aria-label="Language Switch">
        <button id="btnLangMl" class="active" onclick="setLang('ml')">മലയാളം</button>
        <button id="btnLangEn" onclick="setLang('en')">English</button>
      </div>
    </div>
  </header>

  <section class="date-bar">
    <div class="date-nav">
      <button class="btn" id="btnPrevDay" onclick="shiftDate(-1)">← ഇന്നലെ</button>
      <input type="date" id="targetDate" onchange="onDateInput()">
      <button class="btn" id="btnToday" onclick="setToday()">ഇന്ന്</button>
      <button class="btn" id="btnNextDay" onclick="shiftDate(1)">നാളെ →</button>
    </div>
    <div class="kollam-pill" id="kollamBadge">കൊല്ലവർഷം • ആഴ്ച</div>
  </section>

  <section class="sub-nav-row" id="profilesRow"></section>

  <main id="mainContent"></main>
</div>

<!-- Add / Edit Member Modal -->
<div class="modal-backdrop" id="memberModal">
  <div class="modal">
    <h3 id="modalTitle">അംഗത്തെ ചേർക്കുക</h3>
    <input type="hidden" id="editId">
    <div class="form-row">
      <label id="lblName">പേര് (Name)</label>
      <input type="text" id="inName" placeholder="ഉദാ: അച്ഛൻ / Sreeram">
    </div>
    <div class="form-row">
      <label id="lblDob">ജനനത്തീയതി (Date of Birth)</label>
      <input type="date" id="inDob">
    </div>
    <div class="form-row">
      <label id="lblTob">ജനനസമയം (Time of Birth - 24h)</label>
      <input type="time" id="inTob" value="06:30">
    </div>
    <div class="form-row">
      <label id="lblPlace">ജനനസ്ഥലം (Kerala District)</label>
      <select id="inDistrict"></select>
    </div>
    <div class="form-actions">
      <button class="btn" id="btnCancelModal" onclick="closeModal()">റദ്ദാക്കുക</button>
      <button class="btn btn-primary" id="btnSaveModal" onclick="saveMember()">സേവ് ചെയ്യുക</button>
    </div>
  </div>
</div>

<script src="jyotish-engine.js"></script>
<script>
window.onerror = function(msg, url, line) {
  var b = document.getElementById("errBanner");
  if (b) {
    b.style.display = "block";
    b.textContent = "Notice: " + msg + " (Line " + line + ")";
  }
};

function safeGet(key, fallback) {
  try {
    var raw = localStorage.getItem(key);
    return raw !== null ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

function safeSet(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) {}
}

function safeGetRaw(key, fallback) {
  try {
    var v = localStorage.getItem(key);
    return v !== null ? v : fallback;
  } catch (e) {
    return fallback;
  }
}

function safeSetRaw(key, val) {
  try {
    localStorage.setItem(key, val);
  } catch (e) {}
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function getTodayIST() {
  var now = new Date();
  var istMs = now.getTime() + (5.5 * 3600000);
  return new Date(istMs).toISOString().slice(0, 10);
}

function renderRemediesSection(remedies, lang, t) {
  if (!remedies || remedies.length === 0) return "";
  var itemsHtml = remedies.map(function(rem) {
    var activeDaysTag = (rem.activeDays && rem.activeDays.length)
      ? '<span class="remedy-day" style="margin-left:4px;">' + escHtml(rem.activeDays.join(", ")) + '</span>'
      : "";
    return '<div class="remedy-item">' +
      '<div class="remedy-deity">' + escHtml(rem.deity) + '</div>' +
      '<span class="remedy-day">' + escHtml(rem.dayOfWeek) + '</span>' + activeDaysTag +
      '<p class="remedy-offering">' + escHtml(rem.offering) + '</p>' +
      '<p class="remedy-reason">' + escHtml(rem.reason) + '</p>' +
    '</div>';
  }).join("");

  return '<section class="remedy-card">' +
    '<h3>' + escHtml(t.remedyTitle) + '</h3>' +
    '<p class="remedy-sub">' + escHtml(t.remedySub) + '</p>' +
    '<div class="remedy-list">' + itemsHtml + '</div>' +
  '</section>';
}

var jathakamCache = {};
var state = {
  lang: safeGetRaw("jyotish_lang", "ml"),
  profiles: safeGet("jyotish_profiles", []),
  activeId: safeGetRaw("jyotish_active", ""),
  dateStr: getTodayIST(),
  viewMode: "daily"
};

function saveState() {
  safeSetRaw("jyotish_lang", state.lang);
  safeSet("jyotish_profiles", state.profiles);
  safeSetRaw("jyotish_active", state.activeId);
}

function setLang(l) { state.lang = l; saveState(); render(); }
function setViewMode(m) { state.viewMode = m; render(); }
function selectProfile(id) { state.activeId = id; saveState(); render(); }

function shiftDate(delta) {
  var p = state.dateStr.split("-");
  var dt = new Date(Date.UTC(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)));
  dt.setUTCDate(dt.getUTCDate() + delta);
  state.dateStr = dt.toISOString().slice(0, 10);
  render();
}

function setToday() { state.dateStr = getTodayIST(); render(); }
function onDateInput() {
  var val = document.getElementById("targetDate").value;
  if (val) { state.dateStr = val; render(); }
}

function openModal(editProfile) {
  var E = window.KeralaJyotishEngine;
  var t = UI[state.lang];
  var sel = document.getElementById("inDistrict");
  sel.innerHTML = E.DISTRICTS.map(function(d) {
    return '<option value="' + escHtml(d.id) + '">' + escHtml(state.lang === "ml" ? d.ml : d.en) + '</option>';
  }).join("");

  if (editProfile) {
    document.getElementById("modalTitle").textContent = t.modalEdit;
    document.getElementById("editId").value = editProfile.id;
    document.getElementById("inName").value = editProfile.name;
    document.getElementById("inDob").value = editProfile.dob;
    document.getElementById("inTob").value = editProfile.tob;
    sel.value = editProfile.district;
  } else {
    document.getElementById("modalTitle").textContent = t.modalAdd;
    document.getElementById("editId").value = "";
    document.getElementById("inName").value = "";
    document.getElementById("inDob").value = "1995-01-15";
    document.getElementById("inTob").value = "07:00";
    sel.value = "tvm";
  }
  document.getElementById("lblName").textContent = t.lblName;
  document.getElementById("lblDob").textContent = t.lblDob;
  document.getElementById("lblTob").textContent = t.lblTob;
  document.getElementById("lblPlace").textContent = t.lblPlace;
  document.getElementById("btnCancelModal").textContent = t.cancel;
  document.getElementById("btnSaveModal").textContent = t.save;
  document.getElementById("memberModal").classList.add("open");
}

function closeModal() { document.getElementById("memberModal").classList.remove("open"); }

function saveMember() {
  var name = document.getElementById("inName").value.trim();
  var dob = document.getElementById("inDob").value;
  var tob = document.getElementById("inTob").value || "06:30";
  var district = document.getElementById("inDistrict").value;
  if (!name || !dob) {
    var errEl = document.getElementById("errBanner");
    if (errEl) {
      errEl.style.display = "block";
      errEl.textContent = state.lang === "ml"
        ? "പേരും ജനനത്തീയതിയും നിർബന്ധമാണ്."
        : "Please enter both Name and Date of Birth.";
    }
    return;
  }
  var errClear = document.getElementById("errBanner");
  if (errClear) errClear.style.display = "none";

  var editId = document.getElementById("editId").value;
  if (editId) {
    delete jathakamCache[editId];
    state.profiles = state.profiles.map(function(p) {
      return p.id === editId ? { id: editId, name: name, dob: dob, tob: tob, district: district } : p;
    });
  } else {
    var newId = "p_" + Date.now();
    state.profiles.push({ id: newId, name: name, dob: dob, tob: tob, district: district });
    state.activeId = newId;
  }
  saveState();
  closeModal();
  render();
}

function deleteActiveProfile() {
  delete jathakamCache[state.activeId];
  state.profiles = state.profiles.filter(function(p) { return p.id !== state.activeId; });
  state.activeId = state.profiles.length ? state.profiles[0].id : "";
  saveState();
  render();
}

function render() {
  var E = window.KeralaJyotishEngine;
  if (!E) return;
  var lang = state.lang;
  var t = UI[lang];

  document.getElementById("btnViewDaily").className = state.viewMode === "daily" ? "active" : "";
  document.getElementById("btnViewWeekly").className = state.viewMode === "weekly" ? "active" : "";
  document.getElementById("btnViewDaily").textContent = t.viewDaily;
  document.getElementById("btnViewWeekly").textContent = t.viewWeekly;
  document.getElementById("btnLangMl").className = lang === "ml" ? "active" : "";
  document.getElementById("btnLangEn").className = lang === "en" ? "active" : "";
  document.getElementById("appTitle").textContent = t.title;
  document.getElementById("appSub").textContent = t.sub;
  document.getElementById("btnPrevDay").textContent = t.prev;
  document.getElementById("btnToday").textContent = t.today;
  document.getElementById("btnNextDay").textContent = t.next;
  document.getElementById("targetDate").value = state.dateStr;

  if (!state.profiles || state.profiles.length === 0) {
    var p0 = state.dateStr.split("-");
    var tY0 = parseInt(p0[0], 10), tM0 = parseInt(p0[1], 10), tD0 = parseInt(p0[2], 10);
    var sun0 = E.getSunTimesIST(tY0, tM0, tD0, E.DISTRICTS[0].lat, E.DISTRICTS[0].lon);
    var kol0 = E.getKollavarsham(tY0, tM0, tD0, sun0);
    var vara0 = E.VARAS[new Date(Date.UTC(tY0, tM0 - 1, tD0)).getUTCDay()][lang];
    document.getElementById("kollamBadge").textContent =
      (lang === "ml" ? "കൊല്ലവർഷം " : "Kollavarsham ") + kol0.year + " " + E.KOLLAM_MONTHS[kol0.monthIdx][lang] + " " + kol0.day + " • " + vara0;
    document.getElementById("profilesRow").innerHTML = "";
    document.getElementById("mainContent").innerHTML =
      '<section class="empty-state">' +
        '<div class="empty-icon">✦</div>' +
        '<h2>' + escHtml(t.emptyTitle) + '</h2>' +
        '<p>' + escHtml(t.emptyBody) + '</p>' +
        '<button class="btn btn-primary" onclick="openModal(null)">' + escHtml(t.emptyCta) + '</button>' +
      '</section>';
    return;
  }

  var active = state.profiles.find(function(p) { return p.id === state.activeId; }) || state.profiles[0];
  state.activeId = active.id;

  var pLeft = state.profiles.map(function(p) {
    return '<button class="profile-pill ' + (p.id === active.id ? "active" : "") + '" data-id="' + escHtml(p.id) + '" onclick="selectProfile(this.dataset.id)">' + escHtml(p.name) + '</button>';
  }).join("");
  var pRight = '<button class="profile-pill" onclick="openModal(null)">' + escHtml(t.addMember) + '</button>' +
    '<button class="btn" onclick="openModal(state.profiles.find(function(x){return x.id===state.activeId;}))">' + escHtml(t.editMember) + '</button>' +
    '<button class="btn" onclick="deleteActiveProfile()">' + escHtml(t.delMember) + '</button>';
  document.getElementById("profilesRow").innerHTML =
    '<div class="profiles-row">' + pLeft + '</div>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap;">' + pRight + '</div>';

  if (!jathakamCache[active.id]) {
    jathakamCache[active.id] = E.computeFullJathakam(active);
  }
  var jk = jathakamCache[active.id];
  var ev = E.evaluateDay(active, state.dateStr, lang, jk);
  var dist = ev.distilled;

  document.getElementById("kollamBadge").textContent = dist.kollamLabel;

  var bodyHtml = "";
  if (state.viewMode === "weekly") {
    var wk = E.evaluateWeek(active, state.dateStr, lang, jk);
    var daysHtml = wk.days.map(function(d) {
      var vCls = { great: "st-great", good: "st-good", okay: "st-okay", slow: "st-slow" }[d.verdictKey];
      var vLbl = { great: t.stGreat, good: t.stGood, okay: t.stOkay, slow: t.stSlow }[d.verdictKey];
      return '<div class="week-day-row">' +
        '<div class="week-day-left">' +
          '<div class="week-day-title">' + escHtml(d.vara[lang] + " • " + d.dateStr) + '</div>' +
          '<div class="week-day-meta">' + escHtml(d.moonNak[lang] + " • " + d.moonRashi[lang] + " • " + d.tara[lang]) + '</div>' +
          '<p class="week-day-sum">' + escHtml(d.summary) + '</p>' +
        '</div>' +
        '<span class="status-badge ' + vCls + '">' + escHtml(vLbl) + '</span>' +
      '</div>';
    }).join("");

    var dayMapByPlanet = {};
    wk.days.forEach(function(d) {
      (d.remedies || []).forEach(function(r) {
        if (!dayMapByPlanet[r.planet]) dayMapByPlanet[r.planet] = [];
        var lbl = d.vara[lang] + " (" + d.dateStr.slice(5) + ")";
        if (dayMapByPlanet[r.planet].indexOf(lbl) === -1) dayMapByPlanet[r.planet].push(lbl);
      });
    });
    var annotatedWeeklyRemedies = (wk.weeklyRemedies || []).map(function(r) {
      var copy = {};
      for (var k in r) copy[k] = r[k];
      copy.activeDays = dayMapByPlanet[r.planet] || [];
      return copy;
    });

    bodyHtml =
      '<section class="week-card">' +
        '<h3>' + escHtml(t.weekTitle) + ' (' + escHtml(wk.startDate) + ' → ' + escHtml(wk.endDate) + ')</h3>' +
        '<p class="week-overview">' + escHtml(wk.weeklyOverview) + '</p>' +
        '<div class="week-days">' + daysHtml + '</div>' +
      '</section>' +
      renderRemediesSection(annotatedWeeklyRemedies, lang, t);
  } else {
    var verdictClass = { great: "st-great", good: "st-good", okay: "st-okay", slow: "st-slow" }[dist.verdictKey];
    var verdictLabel = { great: t.stGreat, good: t.stGood, okay: t.stOkay, slow: t.stSlow }[dist.verdictKey];

    var domainTitles = { work: t.workTitle, mood: t.moodTitle, money: t.moneyTitle };
    var domainHtml = dist.narrative.domains.map(function(d) {
      var pillCls = d.status === "strong" ? "st-great" : (d.status === "careful" ? "st-slow" : "st-okay");
      var pillTxt = d.status === "strong" ? t.dStrong : (d.status === "careful" ? t.dCareful : t.dSteady);
      return '<div class="domain-card">' +
        '<div class="domain-head"><h3>' + escHtml(domainTitles[d.key]) + '</h3><span class="d-pill ' + pillCls + '">' + escHtml(pillTxt) + '</span></div>' +
        '<p>' + escHtml(d.text) + '</p>' +
      '</div>';
    }).join("");

    bodyHtml =
      '<section class="verdict-card">' +
        '<div class="verdict-top">' +
          '<div class="person-meta">' +
            '<h2>' + escHtml(dist.name) + ' <span class="tag">' + dist.ageYears + ' ' + escHtml(t.ageUnit) + '</span></h2>' +
            '<div class="meta-tags">' +
              '<span class="tag">' + escHtml(t.birthStar) + ': ' + escHtml(dist.identityTags.nakshatra) + '</span>' +
              '<span class="tag">' + escHtml(t.birthRashi) + ': ' + escHtml(dist.identityTags.rashi) + '</span>' +
              '<span class="tag">' + escHtml(t.lagna) + ': ' + escHtml(dist.identityTags.lagna) + '</span>' +
              '<span class="tag">' + escHtml(t.dasha) + ': ' + escHtml(dist.identityTags.dasha) + '</span>' +
              '<span class="tag">' + escHtml(dist.identityTags.place) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="status-badge ' + verdictClass + '">' + escHtml(verdictLabel) + '</div>' +
        '</div>' +
        '<p class="verdict-summary">' + escHtml(dist.narrative.summary) + '</p>' +
      '</section>' +

      '<section class="grid-3">' + domainHtml + '</section>' +

      renderRemediesSection(dist.remedies, lang, t) +

      '<section class="windows-card">' +
        '<h3>' + escHtml(t.winTitle) + '</h3>' +
        '<div class="win-grid">' +
          '<div class="win-box good-win"><div class="win-title">' + escHtml(t.abhijit) + '</div><div class="win-time">' + escHtml(dist.windows.abhijit) + '</div><div class="win-note">' + escHtml(t.abhijitNote) + '</div></div>' +
          '<div class="win-box good-win"><div class="win-title">' + escHtml(t.powerHora) + '</div><div class="win-time">' + escHtml(dist.windows.powerHora) + '</div><div class="win-note">' + escHtml(t.powerHoraNote) + '</div></div>' +
          '<div class="win-box bad-win"><div class="win-title">' + escHtml(t.rahu) + '</div><div class="win-time">' + escHtml(dist.windows.rahu) + '</div><div class="win-note">' + escHtml(t.rahuNote) + '</div></div>' +
          '<div class="win-box good-win"><div class="win-title">' + escHtml(t.gulikan) + '</div><div class="win-time">' + escHtml(dist.windows.gulikan) + '</div><div class="win-note">' + escHtml(t.gulikanNote) + '</div></div>' +
        '</div>' +
      '</section>';
  }

  document.getElementById("mainContent").innerHTML = bodyHtml;
}

document.addEventListener("DOMContentLoaded", render);
</script>
