<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<title>കുടുംബ ദൈനംദിന ജ്യോതിഷ വഴികാട്ടി | Family Daily Jyotish Compass</title>
<style>
  :root {
    --bg-top: #eef4f8;
    --bg-bottom: #f7f5f0;
    --surface: rgba(255, 255, 255, 0.88);
    --surface-solid: #ffffff;
    --surface-soft: #f2f6f9;
    --ink: #1a2938;
    --muted: #5a6d7e;
    --accent: #275d8c;
    --accent-deep: #1b4266;
    --accent-soft: #e3eff9;
    --border: rgba(39, 93, 140, 0.12);
    --great-bg: #e4f4ec;
    --great-fg: #185a3a;
    --good-bg: #e5effa;
    --good-fg: #1d4b82;
    --okay-bg: #fbf3e4;
    --okay-fg: #7c4d14;
    --slow-bg: #fbeaea;
    --slow-fg: #872929;
    --radius-lg: 24px;
    --radius-md: 18px;
    --radius-sm: 12px;
    --shadow-soft: 0 12px 32px rgba(26, 41, 56, 0.06);
    --shadow-pill: 0 4px 12px rgba(26, 41, 56, 0.04);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans Malayalam", "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(175deg, var(--bg-top) 0%, var(--bg-bottom) 48%, #f4f1ea 100%);
    color: var(--ink);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 20px 18px 64px;
  }

  /* Calm Header */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 6px 4px 18px;
  }

  .brand h1 {
    margin: 0;
    font-size: 1.32rem;
    font-weight: 700;
    color: var(--accent-deep);
    letter-spacing: -0.015em;
  }

  .brand p {
    margin: 3px 0 0;
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 400;
  }

  .controls-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .lang-toggle {
    display: inline-flex;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 999px;
    padding: 4px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-pill);
  }

  .lang-toggle button {
    border: none;
    background: transparent;
    padding: 6px 15px;
    border-radius: 999px;
    font-size: 0.84rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.22s ease;
  }

  .lang-toggle button.active {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(39, 93, 140, 0.28);
  }

  /* Date & Kollavarsham Pill Strip */
  .date-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 4px 0 18px;
    background: var(--surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 12px 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
  }

  .date-nav {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }

  .btn {
    border: 1px solid var(--border);
    background: var(--surface-solid);
    color: var(--ink);
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 0.83rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s ease;
  }

  .btn:hover {
    background: var(--accent-soft);
    border-color: rgba(39, 93, 140, 0.28);
    color: var(--accent-deep);
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .btn-primary:hover {
    background: var(--accent-deep);
    color: #fff;
  }

  input[type="date"], input[type="text"], input[type="time"], input[type="number"], select {
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 0.86rem;
    font-family: inherit;
    background: var(--surface-solid);
    color: var(--ink);
    outline: none;
    transition: border-color 0.18s ease;
  }

  .modal input[type="date"],
  .modal input[type="text"],
  .modal input[type="time"],
  .modal select {
    border-radius: var(--radius-sm);
    padding: 10px 12px;
  }

  input:focus, select:focus {
    border-color: var(--accent);
  }

  .kollam-pill {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--accent-deep);
    background: var(--accent-soft);
    padding: 6px 14px;
    border-radius: 999px;
    letter-spacing: 0.01em;
  }

  /* Family Profile Switcher */
  .profiles-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
  }

  .profile-pill {
    border: 1px solid var(--border);
    background: var(--surface);
    backdrop-filter: blur(10px);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.87rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: var(--shadow-pill);
    transition: all 0.2s ease;
  }

  .profile-pill:hover {
    transform: translateY(-1px);
    background: #ffffff;
  }

  .profile-pill.active {
    background: linear-gradient(135deg, #275d8c 0%, #1d466b 100%);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 6px 16px rgba(39, 93, 140, 0.26);
  }

  /* Calm Sanctuary Hero Verdict Card */
  .verdict-card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(145deg, #ffffff 0%, #f3f8fc 100%);
    border-radius: var(--radius-lg);
    border: 1px solid rgba(39, 93, 140, 0.14);
    box-shadow: var(--shadow-soft);
    padding: 24px 24px 22px;
    margin-bottom: 18px;
  }

  .verdict-card::before {
    content: "";
    position: absolute;
    top: -48px;
    right: -48px;
    width: 170px;
    height: 170px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(39, 93, 140, 0.09) 0%, rgba(39, 93, 140, 0) 70%);
    pointer-events: none;
  }

  .verdict-top {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
  }

  .person-meta h2 {
    margin: 0;
    font-size: 1.32rem;
    font-weight: 700;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .meta-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 10px;
  }

  .tag {
    font-size: 0.79rem;
    background: rgba(39, 93, 140, 0.07);
    color: #2c4358;
    padding: 4px 11px;
    border-radius: 999px;
    font-weight: 500;
  }

  .status-badge {
    padding: 9px 18px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.94rem;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    letter-spacing: 0.01em;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
  }

  .st-great { background: var(--great-bg); color: var(--great-fg); }
  .st-good  { background: var(--good-bg);  color: var(--good-fg); }
  .st-okay  { background: var(--okay-bg);  color: var(--okay-fg); }
  .st-slow  { background: var(--slow-bg);  color: var(--slow-fg); }

  .verdict-summary {
    margin: 16px 0 0;
    padding-top: 14px;
    border-top: 1px solid rgba(39, 93, 140, 0.09);
    font-size: 0.98rem;
    color: #243748;
    line-height: 1.68;
  }

  /* 3-Domain Guidance Cards */
  .grid-3 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }

  .domain-card {
    background: var(--surface-solid);
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
    padding: 18px 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .domain-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 34px rgba(26, 41, 56, 0.08);
  }

  .domain-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .domain-head h3 {
    margin: 0;
    font-size: 0.98rem;
    font-weight: 700;
    color: var(--accent-deep);
  }

  .d-pill {
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .domain-card p {
    margin: 0;
    font-size: 0.92rem;
    color: #334657;
    line-height: 1.62;
  }

  /* Daytime Windows Card */
  .windows-card {
    background: var(--surface-solid);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
    padding: 20px 22px;
    margin-bottom: 18px;
  }

  .windows-card h3 {
    margin: 0 0 14px;
    font-size: 1rem;
    font-weight: 700;
    color: var(--accent-deep);
  }

  .win-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
  }

  .win-box {
    border: 1px solid rgba(39, 93, 140, 0.1);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    background: var(--surface-soft);
  }

  .win-box.good-win {
    background: linear-gradient(135deg, #f3faf6 0%, #eef6fb 100%);
    border-left: 4px solid #2b8a5b;
  }

  .win-box.bad-win {
    background: linear-gradient(135deg, #fdf5f5 0%, #faf3f0 100%);
    border-left: 4px solid #c94a4a;
  }

  .win-title {
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .win-time {
    font-size: 0.96rem;
    font-weight: 700;
    color: var(--ink);
    margin: 4px 0;
  }

  .win-note {
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.45;
  }

  /* Expandable Jyotish Verification Drawer */
  details.ledger {
    background: var(--surface);
    backdrop-filter: blur(12px);
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    padding: 15px 20px;
    box-shadow: var(--shadow-pill);
  }

  details.ledger summary {
    font-weight: 600;
    cursor: pointer;
    color: var(--accent-deep);
    font-size: 0.92rem;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  details.ledger summary::-webkit-details-marker {
    display: none;
  }

  details.ledger summary::after {
    content: "▾";
    font-size: 1rem;
    color: var(--muted);
    transition: transform 0.2s ease;
  }

  details.ledger[open] summary::after {
    transform: rotate(180deg);
  }

  .ledger-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 0.84rem;
  }

  .ledger-item {
    background: var(--surface-solid);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
  }

  .ledger-item strong {
    display: block;
    color: var(--accent);
    margin-bottom: 3px;
    font-size: 0.8rem;
  }

  /* Calm Modal Sheet */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(17, 29, 43, 0.42);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal {
    background: #ffffff;
    border-radius: var(--radius-lg);
    max-width: 440px;
    width: 100%;
    padding: 24px;
    box-shadow: 0 20px 48px rgba(17, 29, 43, 0.2);
  }

  .modal h3 {
    margin: 0 0 16px;
    color: var(--accent-deep);
    font-size: 1.15rem;
  }

  .form-row {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 13px;
  }

  .form-row label {
    font-size: 0.83rem;
    font-weight: 600;
    color: var(--muted);
  }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }

  #errBanner {
    display: none;
    background: #fee2e2;
    color: #991b1b;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
    font-size: 0.86rem;
    font-weight: 600;
  }

  @media (max-width: 520px) {
    .wrap { padding: 14px 14px 48px; }
    .verdict-card { padding: 18px 16px; }
    .windows-card { padding: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="errBanner"></div>

  <header>
    <div class="brand">
      <h1 id="appTitle">കുടുംബ ദൈനംദിന ജ്യോതിഷ വഴികാട്ടി</h1>
      <p id="appSub">കേരള ജ്യോതിഷ ഗണിതവും ദൈനംദിന മാർഗ്ഗനിർദ്ദേശവും</p>
    </div>
    <div class="controls-top">
      <div class="lang-toggle" role="group" aria-label="Language Switch">
        <button id="btnLangMl" class="active" onclick="setLang('ml')">മലയാളം</button>
        <button id="btnLangEn" onclick="setLang('en')">English</button>
      </div>
    </div>
  </header>

  <section class="date-bar">
    <div class="date-nav">
      <button class="btn" id="btnPrevDay" onclick="shiftDate(-1)">← ഇന്നലെ</button>
      <input type="date" id="targetDate" onchange="onDateInput()">
      <button class="btn" id="btnToday" onclick="setToday()">ഇന്ന്</button>
      <button class="btn" id="btnNextDay" onclick="shiftDate(1)">നാളെ →</button>
    </div>
    <div class="kollam-pill" id="kollamBadge">കൊല്ലവർഷം • ആഴ്ച</div>
  </section>

  <section class="profiles-row" id="profilesRow"></section>

  <main id="mainContent"></main>
</div>

<!-- Add / Edit Member Modal -->
<div class="modal-backdrop" id="memberModal">
  <div class="modal">
    <h3 id="modalTitle">അംഗത്തെ ചേർക്കുക</h3>
    <input type="hidden" id="editId">
    <div class="form-row">
      <label id="lblName">പേര് (Name)</label>
      <input type="text" id="inName" placeholder="ഉദാ: അച്ഛൻ / Rahul">
    </div>
    <div class="form-row">
      <label id="lblDob">ജനനത്തീയതി (Date of Birth)</label>
      <input type="date" id="inDob">
    </div>
    <div class="form-row">
      <label id="lblTob">ജനനസമയം (Time of Birth - 24h)</label>
      <input type="time" id="inTob" value="06:30">
    </div>
    <div class="form-row">
      <label id="lblPlace">ജനനസ്ഥലം (Kerala District)</label>
      <select id="inDistrict"></select>
    </div>
    <div class="form-actions">
      <button class="btn" id="btnCancelModal" onclick="closeModal()">റദ്ദാക്കുക</button>
      <button class="btn btn-primary" id="btnSaveModal" onclick="saveMember()">സേവ് ചെയ്യുക</button>
    </div>
  </div>
</div>

<script>
window.onerror = function(msg, url, line) {
  var b = document.getElementById("errBanner");
  if (b) {
    b.style.display = "block";
    b.textContent = "Engine Notice: " + msg + " (Line " + line + ")";
  }
};

function escHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function getTodayIST() {
  var now = new Date();
  var istMs = now.getTime() + (5.5 * 3600000);
  return new Date(istMs).toISOString().slice(0, 10);
}

/* ============================================================================
   2. ASTRONOMICAL EPHEMERIS & KERALA PANCHANGAM ENGINE (CORRECTED)
   ============================================================================ */
var DEG = Math.PI / 180;
var RAD = 180 / Math.PI;

function norm360(x) {
  x = x % 360;
  return x < 0 ? x + 360 : x;
}

function toJulianDay(year, month, day, hourUT) {
  if (month <= 2) { year -= 1; month += 12; }
  var A = Math.floor(year / 100);
  var B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + hourUT / 24.0 + B - 1524.5;
}

function getLahiriAyanamsa(jd) {
  var t = (jd - 2451545.0) / 36525.0;
  return 23.853056 + 1.396971 * t + 0.000308 * t * t;
}

function getSiderealPlanets(jd) {
  var d = jd - 2451545.0;
  var T = d / 36525.0;
  var ayan = getLahiriAyanamsa(jd);

  var gSun = norm360(357.52911 + 35999.05029 * T - 0.0001537 * T * T);
  var lSun0 = norm360(280.46646 + 36000.76983 * T + 0.0003032 * T * T);
  var eqSun = (1.914602 - 0.004817 * T) * Math.sin(gSun * DEG) + 0.019993 * Math.sin(2 * gSun * DEG);
  var sunTrop = norm360(lSun0 + eqSun);

  var Lp = norm360(218.3164477 + 481267.88123421 * T - 0.0015786 * T * T);
  var D  = norm360(297.8501921 + 445267.1114034 * T - 0.0018819 * T * T);
  var M  = norm360(357.5291092 + 35999.0502909 * T - 0.0001536 * T * T);
  var Mp = norm360(134.9633964 + 477198.8675055 * T + 0.0087414 * T * T);
  var F  = norm360(93.2720950 + 483202.0175233 * T - 0.0036539 * T * T);

  var moonLon = Lp
    + 6.288774 * Math.sin(Mp * DEG)
    + 1.274027 * Math.sin((2 * D - Mp) * DEG)
    + 0.658314 * Math.sin(2 * D * DEG)
    + 0.213618 * Math.sin(2 * Mp * DEG)
    - 0.185116 * Math.sin(M * DEG)
    - 0.114332 * Math.sin(2 * F * DEG)
    + 0.058793 * Math.sin((2 * D - 2 * Mp) * DEG)
    + 0.057066 * Math.sin((2 * D - M - Mp) * DEG)
    + 0.053322 * Math.sin((2 * D + Mp) * DEG)
    + 0.045758 * Math.sin((2 * D - M) * DEG)
    - 0.040923 * Math.sin((M - Mp) * DEG)
    - 0.034720 * Math.sin(D * DEG)
    - 0.030383 * Math.sin((M + Mp) * DEG);
  var moonTrop = norm360(moonLon);

  var rahuTrop = norm360(125.04452 - 1934.136261 * T + 0.0020708 * T * T);
  var ketuTrop = norm360(rahuTrop + 180);

  function helioToGeo(a, e, I, L0, n, wBar, Om) {
    var L = norm360(L0 + n * d);
    var M_p = norm360(L - wBar);
    var E = M_p + e * RAD * Math.sin(M_p * DEG) * (1.0 + e * Math.cos(M_p * DEG));
    var xv = a * (Math.cos(E * DEG) - e);
    var yv = a * Math.sqrt(1.0 - e * e) * Math.sin(E * DEG);
    var v = Math.atan2(yv, xv) * RAD;
    var r = Math.sqrt(xv * xv + yv * yv);
    var u = (v + wBar - Om) * DEG;
    var xh = r * (Math.cos(Om * DEG) * Math.cos(u) - Math.sin(Om * DEG) * Math.sin(u) * Math.cos(I * DEG));
    var yh = r * (Math.sin(Om * DEG) * Math.cos(u) + Math.cos(Om * DEG) * Math.sin(u) * Math.cos(I * DEG));

    var rE = 1.00014 - 0.01671 * Math.cos(gSun * DEG) - 0.00014 * Math.cos(2 * gSun * DEG);
    var lE = norm360(sunTrop + 180);
    var xe = rE * Math.cos(lE * DEG);
    var ye = rE * Math.sin(lE * DEG);
    return norm360(Math.atan2(yh - ye, xh - xe) * RAD);
  }

  var mercTrop = helioToGeo(0.387098, 0.205630, 7.0047, 252.25032, 4.0923344368, 77.45779, 48.33076);
  var venTrop  = helioToGeo(0.723332, 0.006773, 3.3946, 181.97973, 1.6021302244, 131.60246, 76.67984);
  var marsTrop = helioToGeo(1.523688, 0.093405, 1.8497, 355.43300, 0.5240207766, 336.06023, 49.55740);
  var jupTrop  = helioToGeo(5.202561, 0.048498, 1.3030, 34.35151, 0.08309121, 14.33120, 100.46440);
  var satTrop  = helioToGeo(9.554747, 0.055546, 2.4886, 50.07744, 0.03345965, 93.05723, 113.66340);

  return {
    ayanamsa: ayan,
    Sun:     norm360(sunTrop - ayan),
    Moon:    norm360(moonTrop - ayan),
    Mars:    norm360(marsTrop - ayan),
    Mercury: norm360(mercTrop - ayan),
    Jupiter: norm360(jupTrop - ayan),
    Venus:   norm360(venTrop - ayan),
    Saturn:  norm360(satTrop - ayan),
    Rahu:    norm360(rahuTrop - ayan),
    Ketu:    norm360(ketuTrop - ayan)
  };
}

// FIXED Bug B: Exact 4-quadrant Sidereal Ascendant (Lagna) without erroneous +180 flip
function getSiderealLagna(jd, lat, lon) {
  var T = (jd - 2451545.0) / 36525.0;
  var gmst = norm360(280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * T * T);
  var lst = norm360(gmst + lon) * DEG;
  var eps = (23.439291 - 0.0130042 * T) * DEG;
  var phi = lat * DEG;
  var y = Math.cos(lst);
  var x = -(Math.sin(lst) * Math.cos(eps) + Math.tan(phi) * Math.sin(eps));
  var ascTrop = norm360(Math.atan2(y, x) * RAD);
  return norm360(ascTrop - getLahiriAyanamsa(jd));
}

function getSunTimesIST(year, month, day, lat, lon) {
  var jd0 = toJulianDay(year, month, day, 0);
  var n = jd0 - 2451545.0 + 0.0008;
  var jStar = n - lon / 360.0;
  var M = norm360(357.5291 + 0.98560028 * jStar);
  var C = 1.9148 * Math.sin(M * DEG) + 0.0200 * Math.sin(2 * M * DEG);
  var lam = norm360(M + C + 180 + 102.9372);
  var jTransit = 2451545.0 + jStar + 0.0053 * Math.sin(M * DEG) - 0.0069 * Math.sin(2 * lam * DEG);
  var sinDec = Math.sin(lam * DEG) * Math.sin(23.44 * DEG);
  var cosDec = Math.cos(Math.asin(sinDec));
  var cosOmega = (Math.sin(-0.83 * DEG) - Math.sin(lat * DEG) * sinDec) / (Math.cos(lat * DEG) * cosDec);
  cosOmega = Math.max(-1, Math.min(1, cosOmega));
  var omega = Math.acos(cosOmega) * RAD;
  var jRise = jTransit - omega / 360.0;
  var jSet  = jTransit + omega / 360.0;

  function jdToIST(j) {
    var frac = (j + 0.5) - Math.floor(j + 0.5);
    return (frac * 24.0 + 5.5) % 24.0;
  }
  return { sunrise: jdToIST(jRise), sunset: jdToIST(jSet) };
}

function fmtTime(decHours) {
  var h = Math.floor(decHours) % 24;
  var m = Math.round((decHours - Math.floor(decHours)) * 60);
  if (m === 60) { h = (h + 1) % 24; m = 0; }
  var ampm = h >= 12 ? "PM" : "AM";
  var h12 = h % 12; if (h12 === 0) h12 = 12;
  return (h12 < 10 ? "0" : "") + h12 + ":" + (m < 10 ? "0" : "") + m + " " + ampm;
}

var DASHA_ORDER = [
  { lord: "Ketu", yrs: 7 }, { lord: "Venus", yrs: 20 }, { lord: "Sun", yrs: 6 },
  { lord: "Moon", yrs: 10 }, { lord: "Mars", yrs: 7 }, { lord: "Rahu", yrs: 18 },
  { lord: "Jupiter", yrs: 16 }, { lord: "Saturn", yrs: 19 }, { lord: "Mercury", yrs: 17 }
];

function getVimshottari(birthMoonLon, birthJd, targetJd) {
  var nakSpan = 360.0 / 27.0;
  var nakIdx = Math.floor(birthMoonLon / nakSpan);
  var remFrac = 1.0 - ((birthMoonLon % nakSpan) / nakSpan);
  var startSeq = nakIdx % 9;

  var elapsedDays = Math.max(0, targetJd - birthJd);
  var elapsedYears = elapsedDays / 365.2425;

  var firstYears = DASHA_ORDER[startSeq].yrs * remFrac;
  var mahaIdx = startSeq;
  var yearIntoMaha = 0;

  if (elapsedYears < firstYears) {
    yearIntoMaha = (DASHA_ORDER[startSeq].yrs - firstYears) + elapsedYears;
  } else {
    var rem = elapsedYears - firstYears;
    mahaIdx = (startSeq + 1) % 9;
    while (rem >= DASHA_ORDER[mahaIdx].yrs) {
      rem -= DASHA_ORDER[mahaIdx].yrs;
      mahaIdx = (mahaIdx + 1) % 9;
    }
    yearIntoMaha = rem;
  }

  var mahaLord = DASHA_ORDER[mahaIdx].lord;
  var mahaTotal = DASHA_ORDER[mahaIdx].yrs;

  var apaIdx = mahaIdx;
  var acc = 0;
  for (var i = 0; i < 9; i++) {
    var dur = (mahaTotal * DASHA_ORDER[apaIdx].yrs) / 120.0;
    if (yearIntoMaha < acc + dur) break;
    acc += dur;
    apaIdx = (apaIdx + 1) % 9;
  }
  return { maha: mahaLord, apaharam: DASHA_ORDER[apaIdx].lord };
}

// FIXED Bug A: Exact Kollavarsham Solar Date using 3/5ths Daytime (Aparahna) Sankramam Rule
function getKollavarsham(year, month, day, sunTimes) {
  // Kerala rule: Sankramam cutoff is 3/5ths of daytime (Madhyahna/Aparahna boundary)
  var cutoffIST = sunTimes.sunrise + 0.60 * (sunTimes.sunset - sunTimes.sunrise);
  var jdCutoffUT = toJulianDay(year, month, day, cutoffIST - 5.5);
  var sunLonToday = getSiderealPlanets(jdCutoffUT).Sun;
  var mIdx = Math.floor(sunLonToday / 30.0);

  // Step backward day-by-day until Sun Rashi changes to count exact elapsed days since Sankramam
  var solarDay = 1;
  for (var back = 1; back <= 33; back++) {
    var prevSun = getSiderealPlanets(jdCutoffUT - back).Sun;
    if (Math.floor(prevSun / 30.0) === mIdx) {
      solarDay++;
    } else {
      break;
    }
  }

  // Kollam Era (ME) increments on Chingam 1 (mIdx === 4, mid-August)
  var kYear = year - 825;
  if (month > 8 || (month === 8 && mIdx >= 4)) {
    kYear = year - 824;
  }
  return { year: kYear, monthIdx: mIdx, day: solarDay };
}

/* ============================================================================
   3. KERALA JYOTHISHAM 3-LAYER CONFIRMATION & DAILY GUIDANCE ENGINE
   ============================================================================ */
var MOON_GOOD_HOUSES = { 1: 5, 3: 12, 6: 9, 7: 2, 10: 4, 11: 8 };
var MOON_BAD_HOUSES  = [4, 8, 12];

function houseOffset(fromSign, toSign) {
  return ((toSign - fromSign + 12) % 12) + 1;
}

function evaluateDay(profile, dateStr, lang) {
  var parts = dateStr.split("-");
  var tY = parseInt(parts[0], 10), tM = parseInt(parts[1], 10), tD = parseInt(parts[2], 10);

  var bParts = profile.dob.split("-");
  var bY = parseInt(bParts[0], 10), bM = parseInt(bParts[1], 10), bD = parseInt(bParts[2], 10);
  var tParts = (profile.tob || "06:30").split(":");
  var bH = parseInt(tParts[0], 10) + parseInt(tParts[1], 10) / 60.0;

  var dist = DISTRICTS.find(function(x) { return x.id === profile.district; }) || DISTRICTS[0];
  var birthJd = toJulianDay(bY, bM, bD, bH - 5.5);
  var birthPlanets = getSiderealPlanets(birthJd);
  var birthLagnaLon = getSiderealLagna(birthJd, dist.lat, dist.lon);

  var birthNakIdx = Math.floor(birthPlanets.Moon / (360 / 27));
  var birthPada = Math.floor((birthPlanets.Moon % (360 / 27)) / (360 / 108)) + 1;
  var birthRashiIdx = Math.floor(birthPlanets.Moon / 30);
  var birthLagnaIdx = Math.floor(birthLagnaLon / 30);

  var sunTimes = getSunTimesIST(tY, tM, tD, dist.lat, dist.lon);
  var noonJd = toJulianDay(tY, tM, tD, 12.0 - 5.5);
  var ageYears = Math.max(1, Math.floor((noonJd - birthJd) / 365.2425));
  var dasha = getVimshottari(birthPlanets.Moon, birthJd, noonJd);

  var civilDate = new Date(Date.UTC(tY, tM - 1, tD));
  var varaIdx = civilDate.getUTCDay();
  var kollam = getKollavarsham(tY, tM, tD, sunTimes);

  // Waking-Day 3-Point Sampling (8 AM, 2 PM, 8 PM IST)
  var sampleHours = [8.0, 14.0, 20.0];
  var sampleWeights = [0.35, 0.40, 0.25];
  var taraSignal = 0;
  var gocharSignal = 0;
  var panchangSignal = 0;
  var vedhaBlocked = false;
  var isChandrashtama = false;

  sampleHours.forEach(function(hIST, idx) {
    var w = sampleWeights[idx];
    var sJd = toJulianDay(tY, tM, tD, hIST - 5.5);
    var pl = getSiderealPlanets(sJd);
    var tNak = Math.floor(pl.Moon / (360 / 27));
    var tRashi = Math.floor(pl.Moon / 30);

    var starDist = ((tNak - birthNakIdx + 27) % 27) + 1;
    var taraNum = ((starDist - 1) % 9) + 1;
    taraSignal += TARA_NAMES[taraNum - 1].val * w;

    var mHouse = houseOffset(birthRashiIdx, tRashi);
    if (mHouse === 8) isChandrashtama = true;
    if (MOON_GOOD_HOUSES[mHouse]) {
      var vedhaHouse = MOON_GOOD_HOUSES[mHouse];
      var allSigns = [pl.Sun, pl.Mars, pl.Mercury, pl.Jupiter, pl.Venus, pl.Saturn].map(function(lon) {
        return houseOffset(birthRashiIdx, Math.floor(lon / 30));
      });
      if (allSigns.indexOf(vedhaHouse) !== -1) {
        vedhaBlocked = true;
      } else {
        gocharSignal += 1.0 * w;
      }
    } else if (MOON_BAD_HOUSES.indexOf(mHouse) !== -1) {
      gocharSignal -= (mHouse === 8 ? 1.5 : 0.9) * w;
    }

    var diff = norm360(pl.Moon - pl.Sun);
    var tithiNum = Math.floor(diff / 12.0) + 1;
    var karanaNum = Math.floor(diff / 6.0) + 1;
    var yogaNum = Math.floor(norm360(pl.Moon + pl.Sun) / (360 / 27)) + 1;

    var isVishti = (karanaNum === 8 || karanaNum === 15 || karanaNum === 22 || karanaNum === 29 ||
                    karanaNum === 36 || karanaNum === 43 || karanaNum === 50 || karanaNum === 57);
    var isRiktha = (tithiNum % 15 === 4 || tithiNum % 15 === 9 || tithiNum % 15 === 14 || tithiNum === 30);
    var badYoga = (yogaNum === 6 || yogaNum === 9 || yogaNum === 10 || yogaNum === 13 || yogaNum === 17 || yogaNum === 27);

    if (isVishti || isRiktha || badYoga) panchangSignal -= 0.8 * w;
    else if (tithiNum % 15 === 5 || tithiNum % 15 === 11 || tithiNum === 15 || yogaNum === 16 || yogaNum === 21) panchangSignal += 0.7 * w;
  });

  var midPl = getSiderealPlanets(noonJd);
  var midMoonNakIdx = Math.floor(midPl.Moon / (360 / 27));
  var midMoonRashiIdx = Math.floor(midPl.Moon / 30);
  var midTithiIdx = Math.floor(norm360(midPl.Moon - midPl.Sun) / 12.0);
  var midYogaIdx = Math.floor(norm360(midPl.Moon + midPl.Sun) / (360 / 27));

  var starDistMid = ((midMoonNakIdx - birthNakIdx + 27) % 27) + 1;
  var taraMid = TARA_NAMES[((starDistMid - 1) % 9)];

  // Moon Nakshatra-Lord Chain + Lagna Functional Benefic/Malefic Check
  var nakLord = NAKSHATRAS[midMoonNakIdx].lord;
  var nakLordSign = Math.floor(midPl[nakLord] / 30);
  var nakLordHouseFromLagna = houseOffset(birthLagnaIdx, nakLordSign);
  var lagnaMeta = RASHIS[birthLagnaIdx];
  var isFuncBenefic = lagnaMeta.benefics.indexOf(nakLord) !== -1;
  var isFuncMalefic = lagnaMeta.malefics.indexOf(nakLord) !== -1;

  var chainSignal = 0;
  if ([1, 2, 4, 5, 9, 10, 11].indexOf(nakLordHouseFromLagna) !== -1) {
    chainSignal = isFuncBenefic ? 1.0 : 0.6;
  } else if ([6, 8, 12].indexOf(nakLordHouseFromLagna) !== -1) {
    chainSignal = isFuncMalefic ? -1.0 : -0.6;
  }

  var mercHouse = houseOffset(birthLagnaIdx, Math.floor(midPl.Mercury / 30));
  var venHouse  = houseOffset(birthLagnaIdx, Math.floor(midPl.Venus / 30));
  var marsHouse = houseOffset(birthLagnaIdx, Math.floor(midPl.Mars / 30));
  var moonLagnaHouse = houseOffset(birthLagnaIdx, midMoonRashiIdx);

  var layer1 = taraSignal + gocharSignal;
  var layer2 = chainSignal + (nakLord === dasha.apaharam ? 0.7 : 0);
  var layer3 = panchangSignal;

  var posVotes = (layer1 > 0.35 ? 1 : 0) + (layer2 > 0.35 ? 1 : 0) + (layer3 > 0.25 ? 1 : 0);
  var negVotes = (layer1 < -0.35 ? 1 : 0) + (layer2 < -0.35 ? 1 : 0) + (layer3 < -0.25 ? 1 : 0);

  var verdictKey = "okay";
  if (isChandrashtama && negVotes >= 1) verdictKey = "slow";
  else if (negVotes >= 2) verdictKey = "slow";
  else if (posVotes >= 2 && !isChandrashtama) verdictKey = "great";
  else if (posVotes === 1 && negVotes === 0 && !isChandrashtama) verdictKey = "good";

  var dayDur = sunTimes.sunset - sunTimes.sunrise;
  var oct = dayDur / 8.0;
  var rahuOct = [7, 1, 6, 4, 5, 3, 2][varaIdx];
  var gulikaOct = [6, 5, 4, 3, 2, 1, 0][varaIdx];

  var rahuStart = sunTimes.sunrise + rahuOct * oct;
  var gulikaStart = sunTimes.sunrise + gulikaOct * oct;
  var solarNoon = (sunTimes.sunrise + sunTimes.sunset) / 2.0;
  var abhijitStart = solarNoon - (dayDur / 30.0);
  var abhijitEnd   = solarNoon + (dayDur / 30.0);

  var horaSeq = ["Sun", "Venus", "Mercury", "Moon", "Saturn", "Jupiter", "Mars"];
  var targetHoraLord = dasha.apaharam;
  if (horaSeq.indexOf(targetHoraLord) === -1) targetHoraLord = lagnaMeta.lord;
  var startHoraIdx = horaSeq.indexOf(VARAS[varaIdx].lord);
  var horaDur = dayDur / 12.0;
  var powerHoraIdx = 0;
  for (var h = 0; h < 12; h++) {
    if (horaSeq[(startHoraIdx + h) % 7] === targetHoraLord) { powerHoraIdx = h; break; }
  }
  var pHoraStart = sunTimes.sunrise + powerHoraIdx * horaDur;

  return {
    ageYears: ageYears,
    birthNak: NAKSHATRAS[birthNakIdx],
    birthPada: birthPada,
    birthRashi: RASHIS[birthRashiIdx],
    birthLagna: lagnaMeta,
    dasha: dasha,
    vara: VARAS[varaIdx],
    kollam: kollam,
    sunTimes: sunTimes,
    verdictKey: verdictKey,
    taraMid: taraMid,
    midMoonNak: NAKSHATRAS[midMoonNakIdx],
    midMoonRashi: RASHIS[midMoonRashiIdx],
    midTithi: TITHI_NAMES[midTithiIdx],
    midYoga: YOGA_NAMES[midYogaIdx],
    nakLord: nakLord,
    nakLordHouseFromLagna: nakLordHouseFromLagna,
    vedhaBlocked: vedhaBlocked,
    isChandrashtama: isChandrashtama,
    mercHouse: mercHouse,
    venHouse: venHouse,
    marsHouse: marsHouse,
    moonLagnaHouse: moonLagnaHouse,
    posVotes: posVotes,
    negVotes: negVotes,
    windows: {
      abhijit: fmtTime(abhijitStart) + " – " + fmtTime(abhijitEnd),
      powerHora: fmtTime(pHoraStart) + " – " + fmtTime(pHoraStart + horaDur) + " (" + PLANET_NAMES[targetHoraLord][lang] + ")",
      rahu: fmtTime(rahuStart) + " – " + fmtTime(rahuStart + oct),
      gulikan: fmtTime(gulikaStart) + " – " + fmtTime(gulikaStart + oct)
    }
  };
}

  if (age < 23) return "student";
  if (age <= 45) return "career";

}

        : "പതിവ് ഉത്തരവാദിത്തങ്ങൾ ശാന്തമായി കൈകാര്യം ചെയ്യുക; പ്രധാന തീരുമാനങ്ങൾ ഉച്ചയ്ക്ക് ശേഷം എടുക്കുക."))
      : (workCaution ? "Pace your schedule and avoid overloading your day; delegate routine follow-ups where possible."
        : (workGood ? "Ideal day for leadership decisions, strategic planning, and guiding younger team members."

  } else {

        : (workGood ? "വായന, എഴുത്ത്, സാമൂഹിക കാര്യങ്ങൾ എന്നിവയിൽ സജീവമായി ഇടപെടാൻ ഉന്മേഷമുള്ള ദിവസം."
        : "പതിവ് വ്യായാമവും പ്രാർത്ഥനയും ദിനചര്യകളും കൃത്യസമയത്ത് ചെയ്യുന്നത് മനസ്സിന് സന്തോഷം നൽകും."))

        : (workGood ? "Great energy for personal projects, reading, community activities, or organizing home matters."

  }

  var moodGood = ([1, 4, 5, 7, 11].indexOf(ev.venHouse) !== -1 || [1, 4, 5, 9, 11].indexOf(ev.moonLagnaHouse) !== -1) && !ev.isChandrashtama;
  var moodCaution = ev.isChandrashtama || [6, 8, 12].indexOf(ev.moonLagnaHouse) !== -1 || [1, 7, 8].indexOf(ev.marsHouse) !== -1;

        : (moodGood ? "സുഹൃത്തുക്കളോടൊപ്പം സമയം ചെലവഴിക്കാനും വീട്ടുകാരുമായി മനസ്സ് തുറന്ന് സംസാരിക്കാനും സന്തോഷകരമായ ദിവസം."

var DEFAULT_PROFILES = [
  { id: "p1", name: "Member 1 (Sample)", dob: "1998-06-15", tob: "07:30", district: "tvm" },
  { id: "p2", name: "Parent (Sample)", dob: "1968-11-20", tob: "06:15", district: "ekm" }
];

var state = {
  lang: localStorage.getItem("jyotish_lang") || "ml",
  profiles: JSON.parse(localStorage.getItem("jyotish_profiles") || "null") || DEFAULT_PROFILES,
  activeId: localStorage.getItem("jyotish_active") || "p1",
  dateStr: getTodayIST()
};

function saveState() {
  localStorage.setItem("jyotish_lang", state.lang);
  localStorage.setItem("jyotish_profiles", JSON.stringify(state.profiles));
  localStorage.setItem("jyotish_active", state.activeId);
}

function setLang(l) {
  state.lang = l;
  saveState();
  render();
}

function selectProfile(id) {
  state.activeId = id;
  saveState();
  render();
}

function shiftDate(delta) {
  var p = state.dateStr.split("-");
  var dt = new Date(Date.UTC(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)));
  dt.setUTCDate(dt.getUTCDate() + delta);
  state.dateStr = dt.toISOString().slice(0, 10);
  render();
}

function setToday() {
  state.dateStr = getTodayIST();
  render();
}

function onDateInput() {
  var val = document.getElementById("targetDate").value;
  if (val) { state.dateStr = val; render(); }
}

function openModal(editProfile) {
  var t = UI[state.lang];
  var sel = document.getElementById("inDistrict");
  sel.innerHTML = DISTRICTS.map(function(d) {
    return '<option value="' + escHtml(d.id) + '">' + escHtml(state.lang === "ml" ? d.ml : d.en) + '</option>';
  }).join("");

  if (editProfile) {
    document.getElementById("modalTitle").textContent = t.modalEdit;
    document.getElementById("editId").value = editProfile.id;
    document.getElementById("inName").value = editProfile.name;
    document.getElementById("inDob").value = editProfile.dob;
    document.getElementById("inTob").value = editProfile.tob;
    sel.value = editProfile.district;
  } else {
    document.getElementById("modalTitle").textContent = t.modalAdd;
    document.getElementById("editId").value = "";
    document.getElementById("inName").value = "";
    document.getElementById("inDob").value = "1995-01-15";
    document.getElementById("inTob").value = "07:00";
    sel.value = "tvm";
  }
  document.getElementById("lblName").textContent = t.lblName;
  document.getElementById("lblDob").textContent = t.lblDob;
  document.getElementById("lblTob").textContent = t.lblTob;
  document.getElementById("lblPlace").textContent = t.lblPlace;
  document.getElementById("btnCancelModal").textContent = t.cancel;
  document.getElementById("btnSaveModal").textContent = t.save;
  document.getElementById("memberModal").classList.add("open");
}

function closeModal() {
  document.getElementById("memberModal").classList.remove("open");
}

function saveMember() {
  var name = document.getElementById("inName").value.trim();
  var dob = document.getElementById("inDob").value;
  var tob = document.getElementById("inTob").value || "06:30";
  var district = document.getElementById("inDistrict").value;
  if (!name || !dob) return;

  var editId = document.getElementById("editId").value;
  if (editId) {
    state.profiles = state.profiles.map(function(p) {
      return p.id === editId ? { id: editId, name: name, dob: dob, tob: tob, district: district } : p;
    });
  } else {
    var newId = "p_" + Date.now();
    state.profiles.push({ id: newId, name: name, dob: dob, tob: tob, district: district });
    state.activeId = newId;
  }
  saveState();
  closeModal();
  render();
}

function deleteActiveProfile() {
  if (state.profiles.length <= 1) return;
  state.profiles = state.profiles.filter(function(p) { return p.id !== state.activeId; });
  state.activeId = state.profiles[0].id;
  saveState();
  render();
}

        '<div class="status-badge ' + verdictClass + '">' + escHtml(verdictLabel) + '</div>' +
      '</div>' +
      '<p class="verdict-summary">' + escHtml(summaryText) + '</p>' +
    '</section>' +

    '<section class="grid-3">' + domainHtml + '</section>' +

    '<section class="windows-card">' +
      '<h3>' + escHtml(t.winTitle) + '</h3>' +
      '<div class="win-grid">' +
        '<div class="win-box good-win"><div class="win-title">' + escHtml(t.abhijit) + '</div><div class="win-time">' + escHtml(ev.windows.abhijit) + '</div><div class="win-note">' + escHtml(t.abhijitNote) + '</div></div>' +
        '<div class="win-box good-win"><div class="win-title">' + escHtml(t.powerHora) + '</div><div class="win-time">' + escHtml(ev.windows.powerHora) + '</div><div class="win-note">' + escHtml(t.powerHoraNote) + '</div></div>' +
        '<div class="win-box bad-win"><div class="win-title">' + escHtml(t.rahu) + '</div><div class="win-time">' + escHtml(ev.windows.rahu) + '</div><div class="win-note">' + escHtml(t.rahuNote) + '</div></div>' +
        '<div class="win-box good-win"><div class="win-title">' + escHtml(t.gulikan) + '</div><div class="win-time">' + escHtml(ev.windows.gulikan) + '</div><div class="win-note">' + escHtml(t.gulikanNote) + '</div></div>' +
      '</div>' +
    '</section>' +

    '<details class="ledger">' +
      '<summary>' + escHtml(t.ledgerTitle) + '</summary>' +
      '<div class="ledger-grid">' +
        '<div class="ledger-item"><strong>' + (lang === "ml" ? "ഇന്നത്തെ നക്ഷത്രവും താരാബലവും" : "Today Star & Tara Balam") + '</strong>' + escHtml(ev.midMoonNak[lang]) + ' • ' + escHtml(ev.taraMid[lang]) + '</div>' +
        '<div class="ledger-item"><strong>' + (lang === "ml" ? "ചന്ദ്രരാശിയും വേധ പരിശോധനയും" : "Moon Rashi & Vedha Check") + '</strong>' + escHtml(ev.midMoonRashi[lang]) + ' • ' + (ev.isChandrashtama ? "Chandrashtama (8th)" : (ev.vedhaBlocked ? "Vedha Obstructed" : "Clear")) + '</div>' +
        '<div class="ledger-item"><strong>' + (lang === "ml" ? "നക്ഷത്രനാഥ ശൃംഖല" : "Nakshatra-Lord Chain") + '</strong>' + escHtml(ev.midMoonNak[lang]) + ' → ' + escHtml(nakLordName) + ' (House ' + ev.nakLordHouseFromLagna + ' from Lagna)</div>' +
        '<div class="ledger-item"><strong>' + (lang === "ml" ? "തിഥിയും നിത്യയോഗവും" : "Tithi & Nithya Yoga") + '</strong>' + escHtml(ev.midTithi) + ' • ' + escHtml(ev.midYoga) + '</div>' +
        '<div class="ledger-item"><strong>' + (lang === "ml" ? "സൂര്യോദയവും അസ്തമയവും" : "Local Sunrise & Sunset") + '</strong>' + fmtTime(ev.sunTimes.sunrise) + ' / ' + fmtTime(ev.sunTimes.sunset) + ' IST</div>' +
        '<div class="ledger-item"><strong>' + (lang === "ml" ? "3-തല സ്ഥിരീകരണ ഫലം" : "3-Layer Confirmation Gate") + '</strong>+' + ev.posVotes + ' Supportive / -' + ev.negVotes + ' Caution Layers</div>' +
      '</div>' +
    '</details>';

  document.getElementById("mainContent").innerHTML = mainHtml;
}

document.addEventListener("DOMContentLoaded", render);
</script>
