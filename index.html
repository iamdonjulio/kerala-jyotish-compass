<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>കുടുംബ ദൈനംദിന ജ്യോതിഷ വഴികാട്ടി | Family Daily Jyotish Compass</title>

<!-- Malayalam & Latin Typography: Noto Sans Malayalam + Plus Jakarta Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --font-family: "Plus Jakarta Sans", "Noto Sans Malayalam", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    
    /* Background Canvas */
    --bg-gradient: linear-gradient(180deg, #f1f5f9 0%, #f8fafc 40%, #f4f6f8 100%);
    --surface: rgba(255, 255, 255, 0.92);
    --surface-solid: #ffffff;
    --surface-soft: #f8fafc;
    --surface-subtle: #f1f5f9;
    
    /* Text Inks */
    --ink: #0f172a;
    --ink-secondary: #334155;
    --muted: #64748b;
    --border: rgba(39, 93, 140, 0.12);
    --border-light: rgba(39, 93, 140, 0.08);

    /* Brand Accents */
    --accent: #1e3a8a;
    --accent-glow: #2563eb;
    --accent-soft: #eff6ff;

    /* Ambient Hero Themes based on verdictKey */
    --hero-great-bg: linear-gradient(145deg, #f0fdf4 0%, #fefce8 52%, #ecfdf5 100%);
    --hero-great-border: rgba(16, 185, 129, 0.28);
    --hero-great-shadow: 0 16px 36px rgba(16, 185, 129, 0.09);
    --hero-great-accent: #059669;

    --hero-good-bg: linear-gradient(145deg, #f0f9ff 0%, #e0f2fe 52%, #f8fafc 100%);
    --hero-good-border: rgba(14, 165, 233, 0.28);
    --hero-good-shadow: 0 16px 36px rgba(14, 165, 233, 0.09);
    --hero-good-accent: #0284c7;

    --hero-okay-bg: linear-gradient(145deg, #fffdf7 0%, #fef3c7 52%, #fefce8 100%);
    --hero-okay-border: rgba(217, 119, 6, 0.24);
    --hero-okay-shadow: 0 16px 36px rgba(217, 119, 6, 0.08);
    --hero-okay-accent: #b45309;

    --hero-slow-bg: linear-gradient(145deg, #f8fafc 0%, #f1f5f9 52%, #fef2f2 100%);
    --hero-slow-border: rgba(148, 163, 184, 0.32);
    --hero-slow-shadow: 0 16px 36px rgba(100, 116, 139, 0.09);
    --hero-slow-accent: #64748b;

    /* Status Pill Tints */
    --st-great-bg: #ecfdf5;
    --st-great-fg: #065f46;
    --st-good-bg: #eff6ff;
    --st-good-fg: #1e40af;
    --st-okay-bg: #fefce8;
    --st-okay-fg: #854d0e;
    --st-slow-bg: #fef2f2;
    --st-slow-fg: #991b1b;

    /* Geometry & Shadows */
    --radius-xl: 24px;
    --radius-lg: 18px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --radius-pill: 9999px;

    --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
    --shadow-soft: 0 12px 30px rgba(15, 23, 42, 0.06);
    --shadow-float: 0 20px 48px rgba(15, 23, 42, 0.14);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font-family);
    background: var(--bg-gradient);
    color: var(--ink);
    line-height: 1.72;
    -webkit-font-smoothing: antialiased;
  }

  /* Headings, buttons, badges, pills use line-height: 1.35 and comfortable padding
     so Malayalam vowel marks above and below the baseline (ി, ീ, ു, ൂ, ൃ) never clip */
  h1, h2, h3, h4, .btn, .status-badge, .d-pill, .kollam-pill, .tag, .pill-toggle button {
    line-height: 1.35;
  }

  .wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 16px 16px 72px;
  }

  /* Single-Row Top App Bar */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 4px 16px;
  }

  .brand {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .brand h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.015em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .brand-sub {
    margin: 2px 0 0;
    font-size: 0.80rem;
    color: var(--muted);
    font-weight: 500;
  }

  .top-controls {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .pill-toggle {
    display: inline-flex;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius-pill);
    padding: 3px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }

  .pill-toggle button {
    border: none;
    background: transparent;
    padding: 6px 12px;
    border-radius: var(--radius-pill);
    font-size: 0.80rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
    font-family: inherit;
    transition: all 0.2s ease;
  }

  .pill-toggle button.active {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(30, 58, 138, 0.28);
  }

  /* Horizontal Scrollable Saved Family Member Strip (Weather Cities Style) */
  .members-strip-section {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 18px;
    padding-bottom: 2px;
  }

  .members-scroll-strip {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 6px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    flex: 1;
    min-width: 0;
  }

  .members-scroll-strip::-webkit-scrollbar {
    display: none;
  }

  .member-chip {
    border: 1px solid var(--border);
    background: var(--surface);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 7px 15px;
    border-radius: var(--radius-pill);
    font-size: 0.86rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--ink);
    box-shadow: var(--shadow-sm);
    white-space: nowrap;
    transition: all 0.2s ease;
    font-family: inherit;
  }

  .member-chip:hover {
    background: #ffffff;
    border-color: rgba(30, 58, 138, 0.25);
  }

  .member-chip.active {
    background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
    color: #ffffff;
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(30, 58, 138, 0.26);
  }

  .members-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .btn {
    border: 1px solid var(--border);
    background: var(--surface-solid);
    color: var(--ink);
    padding: 6px 13px;
    border-radius: var(--radius-pill);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.18s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }

  .btn:hover {
    background: var(--accent-soft);
    border-color: rgba(30, 58, 138, 0.28);
    color: var(--accent);
  }

  .btn-primary {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  .btn-primary:hover {
    background: #172554;
    color: #ffffff;
  }

  .btn:disabled, button:disabled {
    opacity: 0.38;
    cursor: not-allowed;
    pointer-events: none;
    box-shadow: none;
  }

  /* Ambient Weather-Style Hero Forecast Card */
  .hero-card {
    position: relative;
    overflow: hidden;
    border-radius: var(--radius-xl);
    padding: 22px 22px 18px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
    transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .hero-great {
    background: var(--hero-great-bg);
    border-color: var(--hero-great-border);
    box-shadow: var(--hero-great-shadow);
  }

  .hero-good {
    background: var(--hero-good-bg);
    border-color: var(--hero-good-border);
    box-shadow: var(--hero-good-shadow);
  }

  .hero-okay {
    background: var(--hero-okay-bg);
    border-color: var(--hero-okay-border);
    box-shadow: var(--hero-okay-shadow);
  }

  .hero-slow {
    background: var(--hero-slow-bg);
    border-color: var(--hero-slow-border);
    box-shadow: var(--hero-slow-shadow);
  }

  .hero-top-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .kollam-pill {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--accent);
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 5px 14px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border);
  }

  .status-badge {
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    font-weight: 700;
    font-size: 0.88rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid transparent;
  }

  .st-great { background: var(--st-great-bg); color: var(--st-great-fg); border-color: rgba(16, 185, 129, 0.2); }
  .st-good  { background: var(--st-good-bg);  color: var(--st-good-fg);  border-color: rgba(14, 165, 233, 0.2); }
  .st-okay  { background: var(--st-okay-bg);  color: var(--st-okay-fg);  border-color: rgba(217, 119, 6, 0.2); }
  .st-slow  { background: var(--st-slow-bg);  color: var(--st-slow-fg);  border-color: rgba(239, 68, 68, 0.2); }

  .hero-verdict-title {
    margin: 2px 0 6px;
    font-size: 1.85rem;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.02em;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px;
  }

  .hero-person-label {
    font-size: 0.96rem;
    font-weight: 600;
    color: var(--muted);
  }

  .hero-astro-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 8px 0 14px;
  }

  .astro-tag {
    font-size: 0.78rem;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: var(--ink-secondary);
    padding: 4px 10px;
    border-radius: var(--radius-pill);
    font-weight: 600;
    border: 1px solid rgba(0, 0, 0, 0.06);
  }

  .hero-summary-text {
    margin: 0;
    font-size: 0.98rem;
    color: var(--ink-secondary);
    line-height: 1.72;
  }

  /* Sleek Compact Date Stepper at bottom of Hero Card */
  .hero-date-stepper {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid rgba(0, 0, 0, 0.08);
  }

  .stepper-nav {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .stepper-date-input {
    padding: 6px 12px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border);
    font-size: 0.85rem;
    font-family: inherit;
    background: rgba(255, 255, 255, 0.88);
    color: var(--ink);
    outline: none;
    font-weight: 600;
  }

  /* Section Title Label */
  .section-heading-label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 10px 4px;
  }

  /* Horizontal Daytime Windows Timeline ("Hourly" Strip) */
  .timeline-section {
    margin-bottom: 22px;
  }

  .timeline-strip {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 4px 2px 14px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x mandatory;
  }

  .timeline-strip::-webkit-scrollbar {
    display: none;
  }

  .timeline-card {
    flex: 0 0 230px;
    scroll-snap-align: start;
    background: var(--surface-solid);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .timeline-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-soft);
  }

  .timeline-head {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dot-green {
    background: #10b981;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
  }

  .dot-coral {
    background: #f43f5e;
    box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.18);
  }

  .dot-teal {
    background: #0d9488;
    box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.18);
  }

  .timeline-title {
    font-size: 0.80rem;
    font-weight: 700;
    color: var(--ink-secondary);
  }

  .timeline-time {
    font-size: 1.02rem;
    font-weight: 800;
    color: var(--ink);
    margin: 2px 0;
  }

  .timeline-note {
    font-size: 0.78rem;
    color: var(--muted);
    line-height: 1.45;
  }

  /* 3-Domain Conditions Cards with Inline Pariharam */
  .grid-3 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }

  .domain-card {
    background: var(--surface-solid);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    justify-content: space-between;
  }

  .domain-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .domain-head h3 {
    margin: 0;
    font-size: 0.98rem;
    font-weight: 700;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .d-pill {
    font-size: 0.74rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: var(--radius-pill);
    white-space: nowrap;
  }

  .domain-text {
    margin: 0;
    font-size: 0.92rem;
    color: var(--ink-secondary);
    line-height: 1.68;
  }

  /* Inline Pariharam Advisory Banner (Inside Careful Domain Cards & Slow Days) */
  .inline-remedy {
    margin-top: 10px;
    background: #fffdf7;
    border: 1px solid rgba(217, 119, 6, 0.24);
    border-left: 4px solid #d97706;
    border-radius: var(--radius-sm);
    padding: 11px 13px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .inline-remedy-head {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }

  .inline-remedy-badge {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #92400e;
    background: #fef3c7;
    padding: 2px 8px;
    border-radius: var(--radius-pill);
  }

  .inline-remedy-deity {
    font-weight: 700;
    font-size: 0.88rem;
    color: #78350f;
  }

  .inline-remedy-offering {
    font-size: 0.86rem;
    color: #1e293b;
    font-weight: 600;
    line-height: 1.45;
  }

  .inline-remedy-meta {
    font-size: 0.77rem;
    color: var(--muted);
  }

  /* 7-Day Forecast Section Below */
  .week-card {
    background: var(--surface-solid);
    border-radius: var(--radius-xl);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
    padding: 22px;
    margin-bottom: 20px;
  }

  .week-card-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  .week-card-head h3 {
    margin: 0;
    font-size: 1.08rem;
    font-weight: 800;
    color: var(--accent);
  }

  .week-count-tag {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    background: var(--surface-subtle);
    padding: 4px 10px;
    border-radius: var(--radius-pill);
  }

  .week-overview {
    margin: 0 0 16px;
    font-size: 0.94rem;
    color: var(--ink-secondary);
    line-height: 1.70;
  }

  .week-days {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .week-day-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    border-radius: var(--radius-md);
    background: var(--surface-soft);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .week-day-row:hover {
    background: #ffffff;
    border-color: rgba(30, 58, 138, 0.25);
    box-shadow: var(--shadow-sm);
    transform: translateY(-1px);
  }

  .week-day-row.is-active-day {
    border-color: var(--accent);
    background: #ffffff;
    box-shadow: 0 4px 16px rgba(30, 58, 138, 0.12);
  }

  .week-day-left {
    flex: 1 1 320px;
  }

  .week-day-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .week-day-title {
    font-weight: 700;
    font-size: 0.94rem;
    color: var(--ink);
  }

  .today-chip {
    font-size: 0.70rem;
    font-weight: 700;
    background: var(--accent);
    color: #ffffff;
    padding: 2px 7px;
    border-radius: var(--radius-pill);
  }

  .week-day-meta {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .week-day-sum {
    font-size: 0.88rem;
    color: var(--ink-secondary);
    margin: 5px 0 0;
    line-height: 1.62;
  }

  .week-day-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .week-row-arrow {
    font-size: 1.1rem;
    color: var(--muted);
    font-weight: 700;
  }

  /* Empty State Onboarding */
  .empty-state {
    background: linear-gradient(155deg, #ffffff 0%, #f0fdf4 50%, #eff6ff 100%);
    border-radius: var(--radius-xl);
    border: 1px solid rgba(30, 58, 138, 0.16);
    box-shadow: var(--shadow-soft);
    padding: 38px 24px;
    text-align: center;
    max-width: 520px;
    margin: 20px auto;
  }

  .empty-icon {
    width: 60px;
    height: 60px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
  }

  .empty-state h2 { margin: 0 0 8px; font-size: 1.22rem; color: var(--accent); }
  .empty-state p { margin: 0 auto 22px; font-size: 0.94rem; color: var(--muted); max-width: 410px; }
  .empty-state .btn-primary { padding: 10px 24px; font-size: 0.94rem; }

  /* Add / Edit Member Modal (Bottom sheet on mobile, dialog on desktop) */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 999;
  }

  .modal-backdrop.open { display: flex; }

  .modal {
    background: #ffffff;
    border-radius: var(--radius-xl);
    max-width: 440px;
    width: 100%;
    padding: 24px;
    box-shadow: var(--shadow-float);
    border: 1px solid var(--border);
  }

  .modal h3 {
    margin: 0 0 16px;
    color: var(--accent);
    font-size: 1.15rem;
    font-weight: 800;
  }

  .form-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }

  .form-row label {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
  }

  input[type="date"], input[type="text"], select {
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    font-size: 0.88rem;
    font-family: inherit;
    background: #ffffff;

function safeGet(key, fallback) {
  try {
    var raw = localStorage.getItem(key);
    return raw !== null ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

function safeSet(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) {}
}

function safeGetRaw(key, fallback) {
  try {
    var v = localStorage.getItem(key);
    return v !== null ? v : fallback;
  } catch (e) {
    return fallback;
  }
}

function safeSetRaw(key, val) {
  try {
    localStorage.setItem(key, val);
  } catch (e) {}
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function getTodayIST() {

function renderInlineRemedyHtml(rem, lang) {

}

function getDomainRemedy(domainKey, remedies, usedMap) {
  if (!remedies || !remedies.length) return null;
  var prefs = {
    mood: ["Moon", "Venus", "Mars", "Jupiter"],
    work: ["Saturn", "Mercury", "Sun", "Mars", "Rahu", "Ketu"],
    money: ["Jupiter", "Venus", "Mercury", "Saturn", "Moon"]
  };
  var pref = prefs[domainKey] || [];
  for (var i = 0; i < pref.length; i++) {
    var p = pref[i];
    var m = remedies.find(function(r) { return r.planet === p && (!usedMap || !usedMap[r.planet]); });
    if (m) {
      if (usedMap) usedMap[m.planet] = true;
      return m;
    }
  }
  var anyUnused = remedies.find(function(r) { return !usedMap || !usedMap[r.planet]; });
  if (anyUnused) {
    if (usedMap) usedMap[anyUnused.planet] = true;
    return anyUnused;
  }
  for (var j = 0; j < pref.length; j++) {
    var p2 = pref[j];
    var m2 = remedies.find(function(r) { return r.planet === p2; });
    if (m2) return m2;
  }
  return remedies[0];
}

function shiftDateStr(dateStr, days) {
  var p = dateStr.split("-");
  var dt = new Date(Date.UTC(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)));
  dt.setUTCDate(dt.getUTCDate() + days);
  return dt.toISOString().slice(0, 10);
}

function getDateBounds() {
  var today = getTodayIST();
  return {
    today: today,
    min: shiftDateStr(today, -7),
    max: shiftDateStr(today, 30)
  };
}

function shiftDate(delta) {
  var bounds = getDateBounds();
  var nextDate = shiftDateStr(state.dateStr, delta);
  if (nextDate < bounds.min || nextDate > bounds.max) return;
  state.dateStr = nextDate;
  render();
}

function setToday() {
  var bounds = getDateBounds();
  state.dateStr = bounds.today;
  render();
}

function onDateInput() {
  var input = document.getElementById("targetDate");
  if (!input) return;
  var val = input.value;
  var bounds = getDateBounds();
  if (!val) {
    input.value = state.dateStr;
    return;
  }
  if (val < bounds.min) val = bounds.min;
  if (val > bounds.max) val = bounds.max;
  state.dateStr = val;
  input.value = val;
  render();
}

function selectDayDate(dStr) {
  var bounds = getDateBounds();
  if (dStr < bounds.min || dStr > bounds.max) return;
  state.dateStr = dStr;
  state.viewMode = "daily";
  render();
  var hf = document.getElementById("heroForecastCard");

}

function to12HourParts(tob24) {
  var parts = String(tob24 || "07:00").split(":");
  var h24 = parseInt(parts[0], 10);
  if (isNaN(h24)) h24 = 7;
  var mVal = parseInt(parts[1], 10);
  if (isNaN(mVal) || mVal < 0 || mVal > 59) mVal = 0;

  var ampm = h24 >= 12 ? "PM" : "AM";
  var hour12 = h24 % 12;
  if (hour12 === 0) hour12 = 12;
  var minStr = (mVal < 10 ? "0" : "") + mVal;

  return {
    hour12: hour12,
    minStr: minStr,
    ampm: ampm
  };
}

function to24HourString(hour12, minStr, ampm) {
  var h = parseInt(hour12, 10);
  if (isNaN(h) || h < 1 || h > 12) h = 12;
  var m = parseInt(minStr, 10);
  if (isNaN(m) || m < 0 || m > 59) m = 0;

  var period = String(ampm || "AM").trim().toUpperCase();
  var h24;
  if (period === "AM") {
    h24 = (h === 12) ? 0 : h;
  } else {
    h24 = (h === 12) ? 12 : h + 12;
  }

  var hStr = (h24 < 10 ? "0" : "") + h24;
  var mStr = (m < 10 ? "0" : "") + m;
  return hStr + ":" + mStr;
}

    document.getElementById("inTobMin").value = tobParts.minStr;
    document.getElementById("inTobAmPm").value = tobParts.ampm;
    sel.value = editProfile.district;
  } else {
    document.getElementById("modalTitle").textContent = t.modalAdd;
    document.getElementById("editId").value = "";
    document.getElementById("inName").value = "";
    document.getElementById("inDob").value = "1995-01-15";
    document.getElementById("inTobHour").value = "7";
    document.getElementById("inTobMin").value = "00";
    document.getElementById("inTobAmPm").value = "AM";
    sel.value = "tvm";
  }
  document.getElementById("lblName").textContent = t.lblName;
  document.getElementById("lblDob").textContent = t.lblDob;
  document.getElementById("lblTob").textContent = t.lblTob;
  document.getElementById("lblPlace").textContent = t.lblPlace;
  document.getElementById("btnCancelModal").textContent = t.cancel;
  document.getElementById("btnSaveModal").textContent = t.save;
  document.getElementById("memberModal").classList.add("open");
}

function closeModal() { document.getElementById("memberModal").classList.remove("open"); }

function saveMember() {
  var name = document.getElementById("inName").value.trim();
  var dob = document.getElementById("inDob").value;
  var h12 = document.getElementById("inTobHour").value;
  var minStr = document.getElementById("inTobMin").value;
  var ampm = document.getElementById("inTobAmPm").value;
  var tob = to24HourString(h12, minStr, ampm);
  var district = document.getElementById("inDistrict").value;
  if (!name || !dob) {
    var errEl = document.getElementById("errBanner");
    if (errEl) {
      errEl.style.display = "block";
      errEl.textContent = state.lang === "ml"
        ? "പേരും ജനനത്തീയതിയും നിർബന്ധമാണ്."
        : "Please enter both Name and Date of Birth.";
    }
    return;
  }
  var errClear = document.getElementById("errBanner");
  if (errClear) errClear.style.display = "none";

  var editId = document.getElementById("editId").value;
  if (editId) {
    delete jathakamCache[editId];
    state.profiles = state.profiles.map(function(p) {
      return p.id === editId ? { id: editId, name: name, dob: dob, tob: tob, district: district } : p;
    });
  } else {
    var newId = "p_" + Date.now();
    state.profiles.push({ id: newId, name: name, dob: dob, tob: tob, district: district });
    state.activeId = newId;
  }
  saveState();
  closeModal();
  render();
}

function deleteActiveProfile() {
  delete jathakamCache[state.activeId];
  state.profiles = state.profiles.filter(function(p) { return p.id !== state.activeId; });
  state.activeId = state.profiles.length ? state.profiles[0].id : "";
  saveState();
  render();
}

function render() {
  var E = window.KeralaJyotishEngine;
  if (!E) return;
  var lang = state.lang;
  var t = UI[lang];

  updateViewToggleButtons();
  var bD = document.getElementById("btnViewDaily");
  var bW = document.getElementById("btnViewWeekly");
  if (bD) bD.textContent = t.viewDaily;
  if (bW) bW.textContent = t.viewWeekly;

  var bMl = document.getElementById("btnLangMl");
  var bEn = document.getElementById("btnLangEn");
  if (bMl) bMl.className = lang === "ml" ? "active" : "";
  if (bEn) bEn.className = lang === "en" ? "active" : "";

  var appT = document.getElementById("appTitle");
  if (appT) appT.textContent = t.title;
  var appS = document.getElementById("appSub");
  if (appS) appS.textContent = t.sub;

  var bounds = getDateBounds();
  if (state.dateStr < bounds.min) state.dateStr = bounds.min;
  if (state.dateStr > bounds.max) state.dateStr = bounds.max;

  // Empty state if no profiles registered
  if (!state.profiles || state.profiles.length === 0) {
    var p0 = state.dateStr.split("-");
    var tY0 = parseInt(p0[0], 10), tM0 = parseInt(p0[1], 10), tD0 = parseInt(p0[2], 10);
    var sun0 = E.getSunTimesIST(tY0, tM0, tD0, E.DISTRICTS[0].lat, E.DISTRICTS[0].lon);
    var kol0 = E.getKollavarsham(tY0, tM0, tD0, sun0);
    var vara0 = E.VARAS[new Date(Date.UTC(tY0, tM0 - 1, tD0)).getUTCDay()][lang];
    var kollamText0 = (lang === "ml" ? "കൊല്ലവർഷം " : "Kollavarsham ") + kol0.year + " " + E.KOLLAM_MONTHS[kol0.monthIdx][lang] + " " + kol0.day + " • " + vara0;

    var pRow = document.getElementById("profilesRow");
    if (pRow) pRow.innerHTML = "";

    var mainEl = document.getElementById("mainContent");
    if (mainEl) {
      mainEl.innerHTML =
        '<section class="hero-card hero-good" id="heroForecastCard">' +
          '<div class="hero-top-row">' +
            '<div class="kollam-pill" id="kollamBadge">' + escHtml(kollamText0) + '</div>' +
          '</div>' +
          '<div class="hero-date-stepper">' +
            '<button class="btn" id="btnPrevDay" onclick="shiftDate(-1)">← ' + escHtml(t.prev) + '</button>' +
            '<input type="date" id="targetDate" class="stepper-date-input" onchange="onDateInput()" min="' + bounds.min + '" max="' + bounds.max + '" value="' + state.dateStr + '">' +
            '<button class="btn" id="btnToday" onclick="setToday()">' + escHtml(t.today) + '</button>' +
            '<button class="btn" id="btnNextDay" onclick="shiftDate(1)">' + escHtml(t.next) + ' →</button>' +
          '</div>' +
        '</section>' +
        '<section class="empty-state">' +
          '<div class="empty-icon">✦</div>' +
          '<h2>' + escHtml(t.emptyTitle) + '</h2>' +
          '<p>' + escHtml(t.emptyBody) + '</p>' +
          '<button class="btn btn-primary" onclick="openModal(null)">' + escHtml(t.emptyCta) + '</button>' +
        '</section>';
    }

    var btnPrev0 = document.getElementById("btnPrevDay");
    if (btnPrev0) btnPrev0.disabled = (state.dateStr <= bounds.min);
    var btnNext0 = document.getElementById("btnNextDay");
    if (btnNext0) btnNext0.disabled = (state.dateStr >= bounds.max);
    return;
  }

  // Active Profile Selection
  var active = state.profiles.find(function(p) { return p.id === state.activeId; }) || state.profiles[0];
  state.activeId = active.id;

  // Render Horizontal Saved Members Strip (Weather City Strip Style)
  var pLeft = state.profiles.map(function(p) {
    var isActive = p.id === active.id;
    return '<button class="member-chip ' + (isActive ? "active" : "") + '" data-id="' + escHtml(p.id) + '" onclick="selectProfile(this.dataset.id)">' +
      (isActive ? "📍 " : "") + escHtml(p.name) +
    '</button>';
  }).join("");

  var pRight =
    '<button class="btn btn-primary" onclick="openModal(null)" title="Add Member">' + escHtml(t.addMember) + '</button>' +
    '<button class="btn" onclick="openModal(state.profiles.find(function(x){return x.id===state.activeId;}))" title="Edit">' + escHtml(t.editMember) + '</button>' +
    '<button class="btn" onclick="deleteActiveProfile()" title="Remove">' + escHtml(t.delMember) + '</button>';

  var pRowEl = document.getElementById("profilesRow");
  if (pRowEl) {
    pRowEl.innerHTML =
      '<div class="members-scroll-strip">' + pLeft + '</div>' +
      '<div class="members-actions">' + pRight + '</div>';
  }

  // Astrological Computations for Active Member
  if (!jathakamCache[active.id]) {
    jathakamCache[active.id] = E.computeFullJathakam(active);
  }
  var jk = jathakamCache[active.id];
  var ev = E.evaluateDay(active, state.dateStr, lang, jk);
  var dist = ev.distilled;
  var wk = E.evaluateWeek(active, state.dateStr, lang, jk);

  // Verdict Classes & Ambient Hero Card Theme
  var verdictThemeClass = {
    great: "hero-great",
    good: "hero-good",
    okay: "hero-okay",
    slow: "hero-slow"
  }[dist.verdictKey] || "hero-good";

  var verdictClass = { great: "st-great", good: "st-good", okay: "st-okay", slow: "st-slow" }[dist.verdictKey];
  var verdictLabel = { great: t.stGreat, good: t.stGood, okay: t.stOkay, slow: t.stSlow }[dist.verdictKey];

  var verdictEmoji = { great: "✨", good: "🌤️", okay: "🌾", slow: "🌫️" }[dist.verdictKey] || "✦";

  // 1. Ambient Weather-Style Hero Forecast Card
  var heroHtml =
    '<section class="hero-card ' + verdictThemeClass + '" id="heroForecastCard">' +
      '<div class="hero-top-row">' +
        '<div class="kollam-pill" id="kollamBadge">' + escHtml(dist.kollamLabel) + '</div>' +
        '<span class="status-badge ' + verdictClass + '">' + verdictEmoji + ' ' + escHtml(verdictLabel) + '</span>' +
      '</div>' +
      '<h2 class="hero-verdict-title">' +
        escHtml(verdictLabel) +
        '<span class="hero-person-label">• ' + escHtml(dist.name) + ' (' + dist.ageYears + ' ' + escHtml(t.ageUnit) + ')</span>' +
      '</h2>' +
      '<div class="hero-astro-meta">' +
        '<span class="astro-tag">' + escHtml(t.birthStar) + ': ' + escHtml(dist.identityTags.nakshatra) + '</span>' +
        '<span class="astro-tag">' + escHtml(t.birthRashi) + ': ' + escHtml(dist.identityTags.rashi) + '</span>' +
        '<span class="astro-tag">' + escHtml(t.lagna) + ': ' + escHtml(dist.identityTags.lagna) + '</span>' +
        '<span class="astro-tag">' + escHtml(t.dasha) + ': ' + escHtml(dist.identityTags.dasha) + '</span>' +
        '<span class="astro-tag">' + escHtml(dist.identityTags.place) + '</span>' +
      '</div>' +
      '<p class="hero-summary-text">' + escHtml(dist.narrative.summary) + '</p>' +
      '<div class="hero-date-stepper">' +
        '<div class="stepper-nav">' +
          '<button class="btn" id="btnPrevDay" onclick="shiftDate(-1)" aria-label="Previous Day">← ' + escHtml(t.prev) + '</button>' +
          '<input type="date" id="targetDate" class="stepper-date-input" onchange="onDateInput()" min="' + bounds.min + '" max="' + bounds.max + '" value="' + state.dateStr + '">' +
          '<button class="btn" id="btnToday" onclick="setToday()">' + escHtml(t.today) + '</button>' +
          '<button class="btn" id="btnNextDay" onclick="shiftDate(1)" aria-label="Next Day">' + escHtml(t.next) + ' →</button>' +
        '</div>' +
        '<span style="font-size:0.78rem;font-weight:600;color:var(--muted);">' + escHtml(state.dateStr) + '</span>' +
      '</div>' +
    '</section>';

  // 2. Horizontal Daytime Windows Timeline ("Hourly" Strip)
  var timelineHtml =
    '<section class="timeline-section">' +
      '<div class="section-heading-label">⏱️ ' + escHtml(t.winTitle) + '</div>' +
      '<div class="timeline-strip">' +
        '<div class="timeline-card">' +
          '<div class="timeline-head"><span class="status-dot dot-green"></span><span class="timeline-title">' + escHtml(t.abhijit) + '</span></div>' +
          '<div class="timeline-time">' + escHtml(dist.windows.abhijit) + '</div>' +
          '<div class="timeline-note">' + escHtml(t.abhijitNote) + '</div>' +
        '</div>' +
        '<div class="timeline-card">' +
          '<div class="timeline-head"><span class="status-dot dot-green"></span><span class="timeline-title">' + escHtml(t.powerHora) + '</span></div>' +
          '<div class="timeline-time">' + escHtml(dist.windows.powerHora) + '</div>' +
          '<div class="timeline-note">' + escHtml(t.powerHoraNote) + '</div>' +
        '</div>' +
        '<div class="timeline-card">' +
          '<div class="timeline-head"><span class="status-dot dot-coral"></span><span class="timeline-title">' + escHtml(t.rahu) + '</span></div>' +
          '<div class="timeline-time">' + escHtml(dist.windows.rahu) + '</div>' +
          '<div class="timeline-note">' + escHtml(t.rahuNote) + '</div>' +
        '</div>' +
        '<div class="timeline-card">' +
          '<div class="timeline-head"><span class="status-dot dot-teal"></span><span class="timeline-title">' + escHtml(t.gulikan) + '</span></div>' +
          '<div class="timeline-time">' + escHtml(dist.windows.gulikan) + '</div>' +
          '<div class="timeline-note">' + escHtml(t.gulikanNote) + '</div>' +
        '</div>' +
      '</div>' +
    '</section>';

  // 3. 3-Domain Conditions Cards with Inline Pariharam
  var domainTitles = { work: t.workTitle, mood: t.moodTitle, money: t.moneyTitle };
  var domainIcons  = { work: "💼", mood: "🤝", money: "💰" };
  var usedPlanets = {};
  var domainCardsHtml = dist.narrative.domains.map(function(d) {
    var pillCls = d.status === "strong" ? "st-great" : (d.status === "careful" ? "st-slow" : "st-okay");
    var pillTxt = d.status === "strong" ? t.dStrong : (d.status === "careful" ? t.dCareful : t.dSteady);
    var inlineRemedyHtml = "";
    if (d.status === "careful") {
      var rem = d.remedy || getDomainRemedy(d.key, dist.remedies, usedPlanets);
      if (rem) {
        inlineRemedyHtml = renderInlineRemedyHtml(rem, lang);
      }
    }
    return '<div class="domain-card">' +
      '<div>' +
        '<div class="domain-head">' +
          '<h3>' + domainIcons[d.key] + ' ' + escHtml(domainTitles[d.key]) + '</h3>' +
          '<span class="d-pill ' + pillCls + '">' + escHtml(pillTxt) + '</span>' +
        '</div>' +
        '<p class="domain-text">' + escHtml(d.text) + '</p>' +
      '</div>' +
      inlineRemedyHtml +
    '</div>';
  }).join("");

  var domainsSectionHtml =
    '<section class="timeline-section">' +
      '<div class="section-heading-label">🌿 ' + (lang === "ml" ? "മേഖലാ വിശകലനം" : "Life Domains") + '</div>' +
      '<div class="grid-3">' + domainCardsHtml + '</div>' +
    '</section>';

  // 4. 7-Day Forecast Section Below (Scrollable without switching views; tap-to-select day)
  var daysHtml = wk.days.map(function(d) {
    var vCls = { great: "st-great", good: "st-good", okay: "st-okay", slow: "st-slow" }[d.verdictKey];
    var vLbl = { great: t.stGreat, good: t.stGood, okay: t.stOkay, slow: t.stSlow }[d.verdictKey];
    var isSelected = d.dateStr === state.dateStr;
    var isToday = d.dateStr === bounds.today;
    var inlineRemedyHtml = "";
    if (d.verdictKey === "slow" && d.remedies && d.remedies.length > 0) {
      inlineRemedyHtml = renderInlineRemedyHtml(d.remedies[0], lang);
    }
    return '<div class="week-day-row ' + (isSelected ? "is-active-day" : "") + '" data-date="' + escHtml(d.dateStr) + '" onclick="selectDayDate(this.dataset.date)" role="button" tabindex="0" title="' + (lang === "ml" ? "ഈ ദിവസത്തെ വിവരങ്ങൾ കാണാൻ ടാപ്പ് ചെയ്യുക" : "Tap to view daily forecast") + '">' +
      '<div class="week-day-left">' +
        '<div class="week-day-title-row">' +
          '<span class="week-day-title">' + escHtml(d.vara[lang]) + ' • ' + escHtml(d.dateStr) + '</span>' +
          (isToday ? '<span class="today-chip">' + escHtml(t.today) + '</span>' : '') +
          (isSelected && !isToday ? '<span class="today-chip" style="background:#475569;">' + (lang === "ml" ? "തിരഞ്ഞെടുത്തത്" : "Selected") + '</span>' : '') +
        '</div>' +
        '<div class="week-day-meta">' + escHtml(d.moonNak[lang]) + ' • ' + escHtml(d.moonRashi[lang]) + ' • ' + escHtml(d.tara[lang]) + '</div>' +
        '<p class="week-day-sum">' + escHtml(d.summary) + '</p>' +
        inlineRemedyHtml +
      '</div>' +
      '<div class="week-day-right">' +
        '<span class="status-badge ' + vCls + '">' + escHtml(vLbl) + '</span>' +
        '<span class="week-row-arrow">›</span>' +
      '</div>' +
    '</div>';
  }).join("");

  var weekSectionHtml =
    '<section class="week-card" id="weekForecastSection">' +
      '<div class="week-card-head">' +
        '<h3>📅 ' + escHtml(t.weekTitle) + ' (' + escHtml(wk.startDate) + ' → ' + escHtml(wk.endDate) + ')</h3>' +
        '<span class="week-count-tag">' + (lang === "ml" ? "7 ദിവസങ്ങൾ" : "7 Days") + '</span>' +
      '</div>' +
      '<p class="week-overview">' + escHtml(wk.weeklyOverview) + '</p>' +
      '<div class="week-days">' + daysHtml + '</div>' +
    '</section>';

  // Put Everything Together Inside mainContent
  var mainEl = document.getElementById("mainContent");
  if (mainEl) {
    mainEl.innerHTML = heroHtml + timelineHtml + domainsSectionHtml + weekSectionHtml;
  }

  // Update Stepper Button Disabled States
  var btnPrev = document.getElementById("btnPrevDay");
  if (btnPrev) {
    btnPrev.disabled = (state.dateStr <= bounds.min);
  }
  var btnNext = document.getElementById("btnNextDay");
  if (btnNext) {
    btnNext.disabled = (state.dateStr >= bounds.max);
  }
}

document.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
